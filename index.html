<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Infinite Chats</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{
  --yellow:#FFD600;--yellow-light:#FFF8CC;--cream:#FAFAF7;
  --dark:#111111;--gray:#6B7280;--light:#F3F4F6;
  --red:#EF4444;--blue:#3B82F6;--green:#10B981;
  --radius:20px;--shadow:0 4px 24px rgba(0,0,0,0.08);
  --shadow-lg:0 8px 40px rgba(0,0,0,0.14);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--dark);overflow:hidden;}
h1,h2,h3,.logo{font-family:'Sora',sans-serif;}

/* Scrollbar */
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-thumb{background:#ddd;border-radius:4px;}

/* Auth */
#auth-view{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#FFFDE7 0%,#FFF9C4 50%,#F0F4FF 100%);
  z-index:1000;
}
.auth-card{
  background:#fff;border-radius:28px;padding:36px 28px;width:90%;max-width:380px;
  box-shadow:var(--shadow-lg);
}
.logo-text{
  background:linear-gradient(135deg,#FFB300,#FF6F00);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  font-size:28px;font-weight:800;letter-spacing:-0.5px;
}
.auth-input{
  width:100%;border:1.5px solid #E5E7EB;border-radius:12px;
  padding:12px 16px;font-size:14px;outline:none;transition:.2s;
  font-family:'DM Sans',sans-serif;
}
.auth-input:focus{border-color:var(--yellow);box-shadow:0 0 0 3px rgba(255,214,0,0.15);}
.btn-primary{
  width:100%;background:var(--yellow);color:var(--dark);border:none;
  border-radius:12px;padding:13px;font-size:15px;font-weight:700;
  cursor:pointer;transition:.2s;font-family:'Sora',sans-serif;
}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(255,214,0,0.4);}
.btn-primary:active{transform:translateY(0);}
.btn-google{
  width:100%;background:#fff;color:#333;border:1.5px solid #E5E7EB;
  border-radius:12px;padding:12px;font-size:14px;font-weight:600;
  cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-google:hover{background:#F9FAFB;border-color:#D1D5DB;}

/* App Shell */
#app-view{position:fixed;inset:0;display:none;flex-direction:column;}
#app-view.active{display:flex;}
.view{position:absolute;inset:0;bottom:70px;overflow-y:auto;display:none;background:var(--cream);}
.view.active{display:block;}

/* Nav Dock */
#nav-dock{
  position:fixed;bottom:0;left:0;right:0;height:70px;
  background:#fff;border-radius:24px 24px 0 0;
  box-shadow:0 -4px 24px rgba(0,0,0,0.08);
  display:flex;align-items:center;justify-content:space-around;
  padding:0 8px;z-index:100;
}
.nav-btn{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  cursor:pointer;padding:6px 12px;border-radius:14px;
  transition:.2s;position:relative;border:none;background:none;
  font-size:10px;color:var(--gray);font-family:'DM Sans',sans-serif;
}
.nav-btn.active{color:var(--dark);}
.nav-btn.active svg{stroke:var(--dark);}
.nav-btn svg{stroke:var(--gray);transition:.2s;}
.nav-btn.active .nav-icon{transform:scale(1.1);}
.nav-icon{display:flex;align-items:center;justify-content:center;}
.nav-badge{
  position:absolute;top:2px;right:6px;
  background:var(--red);color:#fff;font-size:9px;font-weight:700;
  border-radius:10px;min-width:16px;height:16px;display:flex;
  align-items:center;justify-content:center;padding:0 4px;
  border:1.5px solid #fff;display:none;
}
.nav-badge.show{display:flex;}
.upload-fab{
  width:56px;height:56px;background:var(--yellow);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 16px rgba(255,214,0,0.5);
  cursor:pointer;border:none;margin-bottom:14px;
  transition:.2s;
}
.upload-fab:hover{transform:scale(1.08);}
.upload-fab:active{transform:scale(0.95);}

/* Cards */
.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}

/* Home */
.stories-rail{display:flex;gap:12px;padding:16px;overflow-x:auto;scrollbar-width:none;}
.stories-rail::-webkit-scrollbar{display:none;}
.story-item{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  cursor:pointer;flex-shrink:0;
}
.story-avatar{
  width:60px;height:60px;border-radius:50%;object-fit:cover;
  border:3px solid var(--yellow);
}
.story-add{
  width:60px;height:60px;border-radius:50%;background:#F3F4F6;
  display:flex;align-items:center;justify-content:center;
  border:2px dashed #D1D5DB;cursor:pointer;
}
.story-label{font-size:11px;color:var(--gray);max-width:60px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.post-card{background:#fff;margin-bottom:12px;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
.post-header{display:flex;align-items:center;gap:10px;padding:12px 14px;}
.post-avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;cursor:pointer;}
.post-username{font-weight:600;font-size:14px;cursor:pointer;}
.post-time{font-size:11px;color:var(--gray);}
.follow-btn{
  margin-left:auto;padding:5px 14px;border-radius:20px;font-size:12px;
  font-weight:600;border:none;cursor:pointer;transition:.2s;
}
.follow-btn.follow{background:#FEE2E2;color:var(--red);}
.follow-btn.following{background:var(--light);color:var(--gray);}
.post-image{width:100%;display:block;cursor:pointer;max-height:400px;object-fit:cover;}
.post-actions{display:flex;align-items:center;gap:16px;padding:10px 14px;}
.action-btn{display:flex;align-items:center;gap:6px;background:none;border:none;cursor:pointer;font-size:13px;color:var(--gray);font-weight:500;padding:4px 0;transition:.2s;}
.action-btn:hover{color:var(--dark);}
.action-btn svg{transition:.2s;}
.action-btn.liked svg{stroke:var(--red);fill:var(--red);}
.post-caption{padding:4px 14px 8px;font-size:13px;line-height:1.5;}
.post-caption strong{font-weight:700;}
.comments-section{padding:0 14px 12px;}
.comment-item{display:flex;gap:8px;margin-bottom:8px;align-items:flex-start;}
.comment-avatar{width:26px;height:26px;border-radius:50%;object-fit:cover;flex-shrink:0;}
.comment-body{background:var(--light);border-radius:12px;padding:6px 10px;font-size:12px;flex:1;}
.comment-input-row{display:flex;gap:8px;margin-top:8px;}
.comment-input{flex:1;border:1.5px solid #E5E7EB;border-radius:20px;padding:7px 14px;font-size:12px;outline:none;font-family:'DM Sans',sans-serif;}
.comment-input:focus{border-color:var(--yellow);}
.comment-send{background:var(--yellow);border:none;border-radius:20px;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;}
.heart-burst{
  position:fixed;font-size:72px;pointer-events:none;z-index:9999;
  animation:heartburst .8s forwards;
}
@keyframes heartburst{
  0%{opacity:1;transform:translate(-50%,-50%) scale(0.5);}
  50%{opacity:1;transform:translate(-50%,-50%) scale(1.4);}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1);}
}

/* Chat */
.chat-list-item{
  display:flex;align-items:center;gap:12px;padding:13px 16px;
  cursor:pointer;transition:.2s;border-bottom:1px solid #F3F4F6;background:#fff;
}
.chat-list-item:hover{background:#FAFAFA;}
.chat-list-avatar{position:relative;width:46px;height:46px;flex-shrink:0;}
.chat-list-avatar img{width:46px;height:46px;border-radius:50%;object-fit:cover;}
.online-dot{
  position:absolute;bottom:1px;right:1px;width:12px;height:12px;
  background:var(--green);border-radius:50%;border:2px solid #fff;
}
.offline-dot{background:#D1D5DB;}
.chat-list-name{font-weight:600;font-size:14px;}
.chat-list-preview{font-size:12px;color:var(--gray);}

/* Chat Overlay */
#chat-overlay{
  position:fixed;inset:0;background:var(--cream);z-index:200;
  display:none;flex-direction:column;
}
#chat-overlay.active{display:flex;}
.chat-header{
  background:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;
  box-shadow:0 2px 8px rgba(0,0,0,0.06);flex-shrink:0;
}
.chat-header-name{font-weight:700;font-size:16px;}
.chat-header-status{font-size:12px;color:var(--gray);}
.back-btn{background:none;border:none;cursor:pointer;padding:4px;}
.chat-messages{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px;}
.bubble-wrap{display:flex;align-items:flex-end;gap:8px;}
.bubble-wrap.mine{flex-direction:row-reverse;}
.bubble-avatar{width:28px;height:28px;border-radius:50%;object-fit:cover;flex-shrink:0;}
.bubble{
  max-width:72%;padding:9px 13px;border-radius:18px;font-size:13px;line-height:1.5;
  word-break:break-word;position:relative;
}
.bubble.mine{background:var(--yellow);border-bottom-right-radius:4px;color:var(--dark);}
.bubble.theirs{background:#fff;border-bottom-left-radius:4px;box-shadow:var(--shadow);color:var(--dark);}
.bubble-sender{font-size:10px;font-weight:700;color:var(--gray);margin-bottom:2px;}
.bubble-time{font-size:9px;color:rgba(0,0,0,0.35);margin-top:2px;text-align:right;}
.bubble img{max-width:200px;border-radius:10px;display:block;margin-top:4px;}
.bubble-actions{display:none;position:absolute;top:-28px;right:0;background:#fff;border-radius:8px;box-shadow:var(--shadow);padding:4px 8px;gap:8px;flex-direction:row;}
.bubble:hover .bubble-actions{display:flex;}
.bubble-action-btn{background:none;border:none;cursor:pointer;font-size:11px;color:var(--gray);padding:2px 4px;}
.chat-input-bar{
  background:#fff;padding:10px 14px;display:flex;align-items:center;gap:8px;
  box-shadow:0 -2px 8px rgba(0,0,0,0.06);flex-shrink:0;
}
.chat-input{
  flex:1;border:1.5px solid #E5E7EB;border-radius:24px;padding:10px 16px;
  font-size:13px;outline:none;font-family:'DM Sans',sans-serif;
}
.chat-input:focus{border-color:var(--yellow);}
.chat-send-btn{
  width:40px;height:40px;background:var(--yellow);border:none;border-radius:50%;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:.2s;flex-shrink:0;
}
.chat-send-btn:hover{transform:scale(1.08);}
.media-btn{background:none;border:none;cursor:pointer;padding:4px;color:var(--gray);}

/* Upload */
.dropzone{
  border:2px dashed #D1D5DB;border-radius:var(--radius);
  padding:48px 24px;text-align:center;cursor:pointer;
  transition:.2s;background:#F9FAFB;
}
.dropzone:hover{border-color:var(--yellow);background:var(--yellow-light);}
.dropzone-preview{width:100%;border-radius:var(--radius);max-height:300px;object-fit:contain;display:block;margin:0 auto;}
.caption-input{
  width:100%;border:1.5px solid #E5E7EB;border-radius:12px;
  padding:12px 16px;font-size:14px;outline:none;resize:none;
  font-family:'DM Sans',sans-serif;
}
.caption-input:focus{border-color:var(--yellow);}

/* Activity */
.notif-item{display:flex;align-items:center;gap:12px;padding:13px 16px;background:#fff;border-bottom:1px solid #F3F4F6;}
.notif-avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;}
.notif-text{font-size:13px;flex:1;line-height:1.4;}
.notif-time{font-size:11px;color:var(--gray);}

/* Profile */
.profile-header{text-align:center;padding:28px 16px 16px;}
.profile-pic-wrap{position:relative;width:90px;height:90px;margin:0 auto 12px;}
.profile-pic{width:90px;height:90px;border-radius:50%;object-fit:cover;border:3px solid var(--yellow);cursor:pointer;}
.profile-pic-edit{
  position:absolute;bottom:0;right:0;width:26px;height:26px;
  background:var(--yellow);border-radius:50%;display:flex;align-items:center;
  justify-content:center;cursor:pointer;border:2px solid #fff;
}
.profile-username{font-size:20px;font-weight:700;}
.profile-bio{font-size:13px;color:var(--gray);margin-top:4px;padding:0 24px;}
.profile-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#E5E7EB;border-radius:16px;overflow:hidden;margin:16px;}
.stat-item{background:#fff;text-align:center;padding:14px 8px;}
.stat-num{font-size:18px;font-weight:700;font-family:'Sora',sans-serif;}
.stat-label{font-size:11px;color:var(--gray);}
.profile-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:0 0 80px;}
.grid-img{width:100%;aspect-ratio:1;object-fit:cover;cursor:pointer;}
.king-icon{color:#FFB300;font-size:16px;}
.blue-tick{color:#3B82F6;font-size:12px;margin-left:2px;}
.edit-profile-btn{
  background:var(--light);border:none;border-radius:12px;
  padding:8px 20px;font-size:13px;font-weight:600;cursor:pointer;
  transition:.2s;font-family:'DM Sans',sans-serif;
}
.edit-profile-btn:hover{background:#E5E7EB;}
.logout-btn{position:absolute;top:16px;right:16px;background:none;border:none;cursor:pointer;color:var(--gray);}
.share-btn{background:var(--yellow-light);border:1.5px solid var(--yellow);border-radius:12px;padding:7px 16px;font-size:12px;font-weight:600;cursor:pointer;margin-left:8px;}

/* Story viewer */
#story-viewer{
  position:fixed;inset:0;background:#000;z-index:300;
  display:none;flex-direction:column;align-items:center;justify-content:center;
}
#story-viewer.active{display:flex;}
.story-viewer-img{max-width:100%;max-height:80vh;object-fit:contain;border-radius:12px;}
.story-viewer-close{position:absolute;top:20px;right:20px;background:rgba(255,255,255,0.2);border:none;border-radius:50%;width:36px;height:36px;color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.story-progress{width:90%;height:3px;background:rgba(255,255,255,0.3);border-radius:3px;position:absolute;top:14px;left:5%;}
.story-progress-bar{height:100%;background:#fff;border-radius:3px;animation:storyprogress 5s linear forwards;}
@keyframes storyprogress{from{width:0}to{width:100%}}

/* Highlights */
.highlights-rail{display:flex;gap:14px;padding:4px 16px 12px;overflow-x:auto;scrollbar-width:none;}
.highlights-rail::-webkit-scrollbar{display:none;}
.highlight-item{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;flex-shrink:0;}
.highlight-circle{
  width:64px;height:64px;border-radius:50%;background:var(--light);
  border:2px solid #E5E7EB;overflow:hidden;display:flex;align-items:center;justify-content:center;
}
.highlight-circle img{width:100%;height:100%;object-fit:cover;}
.highlight-add{background:var(--yellow-light);border:2px dashed var(--yellow);}
.highlight-label{font-size:10px;color:var(--gray);max-width:64px;text-align:center;}

/* Group overlay */
#group-overlay{
  position:fixed;inset:0;background:var(--cream);z-index:200;
  display:none;flex-direction:column;
}
#group-overlay.active{display:flex;}

/* Search */
#search-overlay{
  position:fixed;inset:0;background:#fff;z-index:250;
  display:none;flex-direction:column;
}
#search-overlay.active{display:flex;}
.search-input-bar{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid #F3F4F6;}
.search-input{flex:1;border:1.5px solid #E5E7EB;border-radius:12px;padding:10px 16px;font-size:14px;outline:none;font-family:'DM Sans',sans-serif;}
.search-input:focus{border-color:var(--yellow);}
.search-result{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;border-bottom:1px solid #F3F4F6;}

/* Modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:500;
  display:none;align-items:center;justify-content:center;
}
.modal-overlay.active{display:flex;}
.modal-box{background:#fff;border-radius:20px;padding:24px;width:88%;max-width:360px;}
.modal-title{font-size:17px;font-weight:700;margin-bottom:12px;}
.modal-input{width:100%;border:1.5px solid #E5E7EB;border-radius:12px;padding:10px 14px;font-size:13px;outline:none;margin-bottom:10px;font-family:'DM Sans',sans-serif;}
.modal-input:focus{border-color:var(--yellow);}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;}
.btn-cancel{background:var(--light);border:none;border-radius:10px;padding:9px 18px;font-size:13px;cursor:pointer;}
.btn-confirm{background:var(--yellow);border:none;border-radius:10px;padding:9px 18px;font-size:13px;font-weight:700;cursor:pointer;}

/* Toast */
#toast{
  position:fixed;bottom:85px;left:50%;transform:translateX(-50%) translateY(20px);
  background:#222;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;
  z-index:9999;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* Section header */
.section-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 4px;}
.section-title{font-size:20px;font-weight:800;font-family:'Sora',sans-serif;}

/* Profile viewer overlay */
#profile-viewer{
  position:fixed;inset:0;background:var(--cream);z-index:220;
  display:none;flex-direction:column;overflow-y:auto;
}
#profile-viewer.active{display:flex;}

/* Reel */
.reel-item{background:#000;border-radius:var(--radius);overflow:hidden;aspect-ratio:9/16;position:relative;max-height:400px;}
.reel-item video{width:100%;height:100%;object-fit:cover;}
.reel-overlay{position:absolute;bottom:12px;left:12px;right:12px;color:#fff;}

/* Mentions */
.mention-chip{color:var(--blue);font-weight:600;cursor:pointer;}

/* Saved */
.saved-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;}

/* Notification types */
.notif-like{background:#FFF5F5;}
.notif-follow{background:#F0FFF4;}
.notif-comment{background:#EFF6FF;}

/* Loading spinner */
.spinner{width:32px;height:32px;border:3px solid #F3F4F6;border-top-color:var(--yellow);border-radius:50%;animation:spin .8s linear infinite;margin:24px auto;}
@keyframes spin{to{transform:rotate(360deg)}}

.reel-actions{position:absolute;right:10px;bottom:40%;display:flex;flex-direction:column;gap:14px;align-items:center;}
.reel-action-btn{background:rgba(255,255,255,0.15);border:none;border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;}

/* Media picker */
.gif-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;max-height:300px;overflow-y:auto;padding:8px;}
.gif-item{border-radius:8px;overflow:hidden;cursor:pointer;}
.gif-item img{width:100%;display:block;}

/* Ban / admin badges */
.admin-badge{background:#7C3AED;color:#fff;font-size:9px;padding:1px 5px;border-radius:6px;font-weight:700;margin-left:4px;}
.king-crown{font-size:14px;margin-left:2px;}

/* Verified tick inline */
.vtick{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;background:var(--blue);border-radius:50%;margin-left:3px;}
.vtick svg{stroke:#fff;width:9px;height:9px;}

/* Blocked */
.blocked-banner{background:#FEF2F2;color:var(--red);text-align:center;padding:12px;font-size:13px;font-weight:600;border-radius:12px;margin:8px;}
</style>
</head>
<body>

<!-- Auth View -->
<div id="auth-view">
  <div class="auth-card">
    <div style="text-align:center;margin-bottom:28px;">
      <div class="logo-text">∞ Infinite Chats</div>
      <p style="color:#9CA3AF;font-size:13px;margin-top:6px;">Connect with everyone, forever</p>
    </div>
    <div id="auth-error" style="background:#FEF2F2;color:#DC2626;padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:12px;display:none;"></div>
    <input id="auth-email" class="auth-input" type="email" placeholder="Email address" style="margin-bottom:10px;"/>
    <input id="auth-pass" class="auth-input" type="password" placeholder="Password" style="margin-bottom:16px;"/>
    <button class="btn-primary" id="auth-submit" style="margin-bottom:12px;">Continue</button>
    <div style="text-align:center;color:#9CA3AF;font-size:12px;margin-bottom:12px;">or</div>
    <button class="btn-google" id="google-auth">

async function processImage(file, maxWidth=900, quality=0.75){
  return new Promise(resolve=>{
    const r=new FileReader();
    r.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>maxWidth){h=h*(maxWidth/w);w=maxWidth;}
        const c=document.createElement('canvas');
        c.width=Math.round(w);c.height=Math.round(h);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        resolve(c.toDataURL('image/jpeg',quality));
      };
      img.src=e.target.result;
    };
    r.readAsDataURL(file);
  });
}

function timeAgo(ts){
  if(!ts)return'';
  const d=Date.now()-ts,s=Math.floor(d/1000);
  if(s<60)return s+'s';if(s<3600)return Math.floor(s/60)+'m';
  if(s<86400)return Math.floor(s/3600)+'h';return Math.floor(s/86400)+'d';
}

function privateKey(a,b){return[a,b].sort().join('_');}

function isOwner(){return currentUser&&currentUser.uid===OWNER_UID;}

window.closeModal=()=>document.getElementById('modal').classList.remove('active');

function showModal(title,bodyHTML,onConfirm){

  document.getElementById('modal-body').innerHTML=bodyHTML;

function addBadge(type, n=1){
  badgeCounts[type]=(badgeCounts[type]||0)+n;
  const el=document.getElementById('badge-'+type);
  if(el){el.textContent=badgeCounts[type];el.classList.add('show');}
}
function clearBadge(type){
  badgeCounts[type]=0;
  const el=document.getElementById('badge-'+type);
  if(el){el.textContent='0';el.classList.remove('show');}
}

document.getElementById('auth-submit').onclick=async()=>{
  const em=document.getElementById('auth-email').value.trim();
  const pw=document.getElementById('auth-pass').value;
  const errEl=document.getElementById('auth-error');
  errEl.style.display='none';
  if(!em||!pw){errEl.textContent='Please enter email and password.';errEl.style.display='block';return;}
  try{
    await signInWithEmailAndPassword(auth,em,pw);
  }catch(e){
    try{
      const cred=await createUserWithEmailAndPassword(auth,em,pw);
      await initUserProfile(cred.user, em.split('@')[0]);
    }catch(e2){errEl.textContent=e2.message;errEl.style.display='block';}
  }
};

document.getElementById('google-auth').onclick=async()=>{
  try{

    await initUserProfile(res.user, res.user.displayName||'User');
  }catch(e){
    const errEl=document.getElementById('auth-error');

async function initUserProfile(user, name){
  const snap=await get(ref(db,`users/${user.uid}`));
  if(!snap.exists()){
    await set(ref(db,`users/${user.uid}`),{
      username:name, photo:user.photoURL||`https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=FFD600&color=333`,
      uid:user.uid, bio:'', verified:false, banned:false, banReason:''
    });
  }
}

onAuthStateChanged(auth,async user=>{
  if(user){
    currentUser=user;
    document.getElementById('auth-view').style.display='none';
    document.getElementById('app-view').classList.add('active');
    await initUserProfile(user, user.displayName||user.email.split('@')[0]);
    setOnlineStatus(true);
    loadMyProfile();
    loadFeed();
    loadChatList();
    listenActivity();
    listenBlocked();
    loadHighlights();
    setView('home');
  } else {
    currentUser=null;
    document.getElementById('auth-view').style.display='flex';
    document.getElementById('app-view').classList.remove('active');
    setOnlineStatus(false);
  }
});

function setOnlineStatus(online){
  if(!currentUser)return;
  set(ref(db,`online/${currentUser.uid}`),online?true:null);
}
window.addEventListener('beforeunload',()=>setOnlineStatus(false));

window.setView=function(v){
  currentView=v;

let feedLoaded=false;
function loadFeed(){
  if(feedLoaded)return;
  feedLoaded=true;
  const fc=document.getElementById('feed-container');
  fc.innerHTML='<div class="spinner"></div>';
  loadStories();
  const postsRef=query(ref(db,'posts'),limitToLast(30));
  onValue(postsRef,snap=>{
    fc.innerHTML='';
    if(!snap.exists()){fc.innerHTML='<p style="text-align:center;color:var(--gray);padding:32px;">No posts yet. Be the first!</p>';return;}
    const posts=[];
    snap.forEach(c=>posts.unshift({id:c.key,...c.val()}));
    posts.forEach(p=>{
      if(p.type==='reel')fc.appendChild(buildReelCard(p));
      else fc.appendChild(buildPostCard(p));
    });
  });
}

function loadStories(){
  const rail=document.getElementById('stories-rail');
  const q=query(ref(db,'stories'),limitToLast(30));
  onValue(q,snap=>{
    // Keep first item (Add Story)
    while(rail.children.length>1)rail.removeChild(rail.lastChild);
    if(!snap.exists())return;
    const stories=[];
    snap.forEach(c=>stories.unshift({id:c.key,...c.val()}));
    stories.forEach(async s=>{
      const snap2=await get(ref(db,`users/${s.uid}`));
      const u=snap2.val()||{username:'User',photo:''};
      const item=document.createElement('div');
      item.className='story-item';
      item.innerHTML=`<img class="story-avatar" src="${s.image}" /><span class="story-label">${u.username}</span>`;
      item.onclick=()=>openStoryViewer(s,u);
      rail.appendChild(item);
    });
  });
}

window.triggerStoryUpload=function(){document.getElementById('story-file-input').click();};
window.uploadStory=async function(e){
  const f=e.target.files[0];if(!f)return;
  showToast('Uploading story...');
  const img=await processImage(f,800,0.7);
  await push(ref(db,'stories'),{image:img,uid:currentUser.uid,timestamp:Date.now()});
  showToast('Story uploaded!');
  e.target.value='';
};

function openStoryViewer(story, user){
  document.getElementById('story-viewer-img').src=story.image;
  document.getElementById('sv-avatar').src=user.photo||`https://ui-avatars.com/api/?name=${user.username}&background=FFD600&color=333`;
  document.getElementById('sv-name').textContent=user.username;
  const bar=document.getElementById('story-progress-bar');
  bar.style.animation='none'; bar.offsetHeight; bar.style.animation='';
  document.getElementById('story-viewer').classList.add('active');
  if(storyTimer)clearTimeout(storyTimer);
  storyTimer=setTimeout(closeStoryViewer,5000);
}
window.closeStoryViewer=function(){
  document.getElementById('story-viewer').classList.remove('active');
  if(storyTimer)clearTimeout(storyTimer);
};

function buildPostCard(p){
  const div=document.createElement('div');
  div.className='post-card';
  div.dataset.pid=p.id;
  const likes=p.likes?Object.keys(p.likes).length:0;
  const isLiked=p.likes&&currentUser&&p.likes[currentUser.uid];
  const comments=p.comments?Object.values(p.comments):[];
  const isMine=p.uid===currentUser?.uid;
  div.innerHTML=`
    <div class="post-header">
      <img class="post-avatar" src="${p.userPhoto||'https://ui-avatars.com/api/?name=User&background=FFD600&color=333'}" onclick="openProfileViewer('${p.uid}')"/>
      <div>
        <div class="post-username" onclick="openProfileViewer('${p.uid}')">${p.username||'User'} <span class="post-vtick" data-uid="${p.uid}"></span></div>
        <div class="post-time">${timeAgo(p.timestamp)}</div>
      </div>
      ${!isMine?`<button class="follow-btn follow" id="follow-${p.uid}" onclick="toggleFollow('${p.uid}','${p.username}')">Follow</button>`:''}
      ${isOwner()?`<button onclick="deletePost('${p.id}')" style="margin-left:auto;background:none;border:none;cursor:pointer;color:var(--red);font-size:11px;">Remove</button>`:''}
      ${isMine&&!isOwner()?`<button onclick="deletePost('${p.id}')" style="margin-left:auto;background:none;border:none;cursor:pointer;color:var(--red);font-size:11px;">Delete</button>`:''}
    </div>
    <img class="post-image" src="${p.image}" ondblclick="doubleTapLike(this,'${p.id}',event)"/>
    <div class="post-actions">
      <button class="action-btn ${isLiked?'liked':''}" id="like-btn-${p.id}" onclick="toggleLike('${p.id}')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="${isLiked?'var(--red)':'none'}" stroke="${isLiked?'var(--red)':'currentColor'}" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        <span id="like-count-${p.id}">${likes}</span>
      </button>
      <button class="action-btn" onclick="toggleComments('${p.id}')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        ${comments.length}
      </button>
      <button class="action-btn" onclick="savePost('${p.id}')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
      </button>
    </div>
    <div class="post-caption"><strong>${p.username||'User'}</strong> ${parseMentions(p.caption||'')}</div>
    <div class="comments-section" id="comments-${p.id}" style="display:none;">
      <div id="comments-list-${p.id}"></div>
      <div class="comment-input-row">
        <input class="comment-input" id="comment-input-${p.id}" placeholder="Add comment... @mention"/>
        <button class="comment-send" onclick="addComment('${p.id}')">Post</button>
      </div>
    </div>
  `;
  // Load comments
  const clDiv=div.querySelector(`#comments-list-${p.id}`);
  if(comments.length>0){
    const show=div.querySelector('.post-actions');
    const toggle=document.createElement('button');
    toggle.className='action-btn';toggle.style.fontSize='12px';toggle.style.color='var(--gray)';
    toggle.textContent=`View all ${comments.length} comment${comments.length>1?'s':''}`;
    toggle.onclick=()=>document.getElementById(`comments-${p.id}`).style.display='block';
    show.parentElement.insertBefore(toggle, div.querySelector('.post-caption').nextSibling);
  }
  comments.slice(-3).forEach(c=>{
    const ci=document.createElement('div');ci.className='comment-item';
    ci.innerHTML=`<img class="comment-avatar" src="${c.photo||'https://ui-avatars.com/api/?name=U&background=FFD600&color=333'}"/><div class="comment-body"><strong>${c.username||'User'}:</strong> ${parseMentions(c.text)}</div>`;
    clDiv.appendChild(ci);
  });
  // Check follow status
  if(!isMine&&currentUser){
    get(ref(db,`following/${currentUser.uid}/${p.uid}`)).then(s=>{
      const btn=div.querySelector(`#follow-${p.uid}`);
      if(btn){
        if(s.exists()){btn.textContent='Following';btn.className='follow-btn following';}
        else{btn.textContent='Follow';btn.className='follow-btn follow';}
      }
    });
  }
  // Check verified tick
  get(ref(db,`users/${p.uid}`)).then(s=>{
    const u=s.val();
    const el=div.querySelector('.post-vtick');
    if(u?.verified&&el){el.innerHTML='<div class="vtick" style="width:13px;height:13px;"><svg viewBox="0 0 24 24" fill="none" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></div>';}
  });
  return div;
}

function buildReelCard(p){
  const div=document.createElement('div');
  div.className='post-card';
  div.innerHTML=`
    <div class="post-header">
      <img class="post-avatar" src="${p.userPhoto||'https://ui-avatars.com/api/?name=User&background=FFD600&color=333'}" onclick="openProfileViewer('${p.uid}')"/>
      <div><div class="post-username">${p.username||'User'}</div><div class="post-time">${timeAgo(p.timestamp)}</div></div>
      ${isOwner()?`<button onclick="deletePost('${p.id}')" style="margin-left:auto;background:none;border:none;cursor:pointer;color:var(--red);font-size:11px;">Remove</button>`:''}
    </div>
    <div class="reel-item">
      <video src="${p.video||p.image}" controls playsinline style="width:100%;max-height:500px;background:#000;"></video>
      <div class="reel-overlay"><div style="font-weight:700;">${p.username||'User'}</div><div style="font-size:12px;opacity:.8;">${p.caption||''}</div></div>
      <div class="reel-actions">
        <button class="reel-action-btn" onclick="toggleLike('${p.id}')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </button>
        <button class="reel-action-btn" onclick="savePost('${p.id}')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        </button>
      </div>
    </div>
  `;
  return div;
}

function parseMentions(text){
  if(!text)return'';
  return text.replace(/@(\w+)/g,'<span class="mention-chip">@$1</span>');
}

window.doubleTapLike=function(el,pid,evt){
  const burst=document.createElement('div');
  burst.className='heart-burst';burst.textContent='❤️';
  burst.style.left=evt.clientX+'px';burst.style.top=evt.clientY+'px';
  document.body.appendChild(burst);
  setTimeout(()=>burst.remove(),800);
  toggleLike(pid);
};

window.toggleLike=async function(pid){
  if(!currentUser)return;
  const lref=ref(db,`posts/${pid}/likes/${currentUser.uid}`);
  const snap=await get(lref);
  if(snap.exists()){
    await remove(lref);
    const c=document.getElementById(`like-count-${pid}`);
    if(c)c.textContent=Math.max(0,parseInt(c.textContent)-1);
    const b=document.getElementById(`like-btn-${pid}`);
    if(b){b.classList.remove('liked');b.querySelector('svg').setAttribute('fill','none');b.querySelector('svg').setAttribute('stroke','currentColor');}
  } else {
    await set(lref,true);
    const c=document.getElementById(`like-count-${pid}`);
    if(c)c.textContent=parseInt(c.textContent)+1;
    const b=document.getElementById(`like-btn-${pid}`);
    if(b){b.classList.add('liked');b.querySelector('svg').setAttribute('fill','var(--red)');b.querySelector('svg').setAttribute('stroke','var(--red)');}
    // Get post owner
    const psnap=await get(ref(db,`posts/${pid}`));
    const pdata=psnap.val();
    if(pdata&&pdata.uid!==currentUser.uid){
      const mySnap=await get(ref(db,`users/${currentUser.uid}`));
      const me=mySnap.val();
      push(ref(db,`notifications/${pdata.uid}`),{
        text:`${me?.username||'Someone'} liked your post`,
        timestamp:Date.now(), type:'like', from:currentUser.uid
      });
    }
  }
};

window.toggleComments=function(pid){
  const el=document.getElementById(`comments-${pid}`);
  if(el)el.style.display=el.style.display==='none'?'block':'none';
};

window.addComment=async function(pid){
  const inp=document.getElementById(`comment-input-${pid}`);
  const text=inp?.value.trim();
  if(!text)return;
  const mySnap=await get(ref(db,`users/${currentUser.uid}`));
  const me=mySnap.val();
  const cref=ref(db,`posts/${pid}/comments`);
  await push(cref,{text,username:me?.username||'User',photo:me?.photo||'',uid:currentUser.uid,timestamp:Date.now()});
  inp.value='';
  const psnap=await get(ref(db,`posts/${pid}`));
  const pd=psnap.val();
  if(pd&&pd.uid!==currentUser.uid){
    push(ref(db,`notifications/${pd.uid}`),{
      text:`${me?.username||'Someone'} commented: ${text.substring(0,30)}`,
      timestamp:Date.now(), type:'comment', from:currentUser.uid
    });
  }
};

window.toggleFollow=async function(targetUid, targetName){
  if(!currentUser||targetUid===currentUser.uid)return;
  const fref=ref(db,`following/${currentUser.uid}/${targetUid}`);
  const snap=await get(fref);
  if(snap.exists()){
    await remove(fref);
    await remove(ref(db,`followers/${targetUid}/${currentUser.uid}`));
  } else {
    await set(fref,true);
    await set(ref(db,`followers/${targetUid}/${currentUser.uid}`),true);
    const mySnap=await get(ref(db,`users/${currentUser.uid}`));
    const me=mySnap.val();
    push(ref(db,`notifications/${targetUid}`),{
      text:`${me?.username||'Someone'} started following you`,
      timestamp:Date.now(), type:'follow', from:currentUser.uid
    });
  }
  // Update all follow buttons for this user
  document.querySelectorAll(`#follow-${targetUid}`).forEach(async btn=>{
    const s2=await get(fref);
    if(s2.exists()){btn.textContent='Following';btn.className='follow-btn following';}
    else{btn.textContent='Follow';btn.className='follow-btn follow';}
  });
};

window.deletePost=async function(pid){

  showModal('Delete Post','<p style="font-size:14px;color:var(--gray);">Are you sure? This cannot be undone.</p>',async()=>{

};

window.savePost=async function(pid){
  if(!currentUser)return;
  await set(ref(db,`saved/${currentUser.uid}/${pid}`),true);
  showToast('Post saved ✓');
};

// ─── Upload ────────────────────────────────────────────────────
let selectedFile=null;
let selectedVideo=null;

window.handleFileSelect=async function(e){
  const f=e.target.files[0];if(!f)return;
  selectedFile=f;
  const isVideo=f.type.startsWith('video');
  const prev=document.getElementById('dropzone-preview');
  const vid=document.getElementById('dropzone-video');
  document.getElementById('dropzone-placeholder').style.display='none';
  if(isVideo){
    prev.style.display='none';vid.style.display='block';
    vid.src=URL.createObjectURL(f);
    setPostType('reel');
  } else {
    vid.style.display='none';prev.style.display='block';
    prev.src=URL.createObjectURL(f);
    setPostType('post');
  }
};

window.publishPost=async function(){
  if(!selectedFile&&!document.getElementById('dropzone-preview').src.startsWith('blob'))
  {showToast('Please select a file first');return;}
  const btn=document.getElementById('publish-btn');
  btn.textContent='Publishing...';btn.disabled=true;
  const cap=document.getElementById('caption-input').value.trim();
  const mySnap=await get(ref(db,`users/${currentUser.uid}`));
  const me=mySnap.val();
  try{
    if(currentPostType==='reel'&&selectedFile?.type.startsWith('video')){
      // For reels we store as base64 (small videos only, warn user)
      const r=new FileReader();
      r.onload=async(ev)=>{
        const b64=ev.target.result;
        await push(ref(db,'posts'),{
          caption:cap, video:b64, image:b64.substring(0,50),
          uid:currentUser.uid, username:me?.username||'User',
          userPhoto:me?.photo||'', timestamp:Date.now(),
          type:'reel', likes:{}, comments:{}
        });
        resetUpload();btn.textContent='Publish';btn.disabled=false;
        showToast('Reel published!');setView('home');feedLoaded=false;loadFeed();
      };
      r.readAsDataURL(selectedFile);
    } else {
      const b64=await processImage(selectedFile,900,0.75);
      await push(ref(db,'posts'),{
        caption:cap, image:b64,
        uid:currentUser.uid, username:me?.username||'User',
        userPhoto:me?.photo||'', timestamp:Date.now(),
        type:'post', likes:{}, comments:{}
      });
      resetUpload();btn.textContent='Publish';btn.disabled=false;
      showToast('Posted!');setView('home');feedLoaded=false;loadFeed();
    }
  }catch(err){
    btn.textContent='Publish';btn.disabled=false;
    showToast('Error: '+err.message);
  }
};

function resetUpload(){
  selectedFile=null;
  document.getElementById('dropzone-placeholder').style.display='block';
  document.getElementById('dropzone-preview').style.display='none';
  document.getElementById('dropzone-video').style.display='none';
  document.getElementById('caption-input').value='';
  document.getElementById('file-input').value='';
}

function loadChatList(){
  const cl=document.getElementById('chat-list');
  cl.innerHTML='';
  // Global Channel
  const gl=document.createElement('div');
  gl.className='chat-list-item';
  gl.innerHTML=`
    <div class="chat-list-avatar">
      <div style="width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#FFD600,#FF6F00);display:flex;align-items:center;justify-content:center;font-size:22px;">🌍</div>
    </div>
    <div><div class="chat-list-name">Global Channel</div><div class="chat-list-preview">Public chat for everyone</div></div>
  `;
  gl.onclick=()=>openChat({uid:'global',name:'Global Channel',photo:'',isGlobal:true});
  cl.appendChild(gl);

  // Groups
  onValue(ref(db,'groups'),snap=>{
    document.querySelectorAll('.group-item').forEach(e=>e.remove());
    if(!snap.exists())return;
    snap.forEach(g=>{
      const gd=g.val();
      if(!gd.members||!gd.members[currentUser.uid])return;
      const gi=document.createElement('div');
      gi.className='chat-list-item group-item';
      gi.innerHTML=`
        <div class="chat-list-avatar">
          <div style="width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#8B5CF6,#6D28D9);display:flex;align-items:center;justify-content:center;font-size:20px;">👥</div>
        </div>
        <div><div class="chat-list-name">${gd.name||'Group'} ${gd.admins&&gd.admins[currentUser.uid]?'<span class="admin-badge">Admin</span>':''}</div><div class="chat-list-preview">Group chat</div></div>
      `;
      gi.onclick=()=>openGroupChat(g.key,gd);
      cl.insertBefore(gi,cl.children[1]);
    });
  });

  // Users
  onValue(ref(db,'users'),snap=>{
    document.querySelectorAll('.user-chat-item').forEach(e=>e.remove());
    if(!snap.exists())return;
    snap.forEach(u=>{
      if(u.key===currentUser.uid)return;
      const ud=u.val();
      if(ud.banned)return;
      const item=document.createElement('div');
      item.className='chat-list-item user-chat-item';
      item.innerHTML=`
        <div class="chat-list-avatar">
          <img src="${ud.photo||`https://ui-avatars.com/api/?name=${ud.username}&background=FFD600&color=333`}"/>
          <div class="online-dot" id="online-${u.key}"></div>
        </div>
        <div>
          <div class="chat-list-name" style="display:flex;align-items:center;gap:4px;">
            ${ud.username||'User'}

          </div>
          <div class="chat-list-preview">Tap to message</div>
        </div>
      `;
      item.onclick=()=>openChat({uid:u.key,name:ud.username,photo:ud.photo,isGlobal:false});
      cl.appendChild(item);
      // Online status
      onValue(ref(db,`online/${u.key}`),s=>{
        const dot=document.getElementById(`online-${u.key}`);
        if(dot){dot.className=s.val()?'online-dot':'online-dot offline-dot';}
      });
    });
  });
}

window.openChat=function(target){
  chatTarget=target;
  document.getElementById('chat-header-name').textContent=target.name;
  document.getElementById('chat-header-avatar').src=target.photo||`https://ui-avatars.com/api/?name=${encodeURIComponent(target.name)}&background=FFD600&color=333`;
  const statusEl=document.getElementById('chat-header-status');
  const blockBtn=document.getElementById('block-btn');
  const blockedNotice=document.getElementById('blocked-notice');
  const inputBar=document.getElementById('chat-input-bar');
  if(target.isGlobal){
    statusEl.textContent='Public chat';
    blockBtn.style.display='none';
    blockedNotice.style.display='none';
    inputBar.style.display='flex';
  } else {
    statusEl.textContent='';
    blockBtn.style.display='block';
    const isBlocked=blockedUsers[target.uid];
    blockBtn.textContent=isBlocked?'Unblock':'Block';
    blockedNotice.style.display=isBlocked?'block':'none';
    inputBar.style.display=isBlocked?'none':'flex';
    // Online status
    onValue(ref(db,`online/${target.uid}`),s=>{
      statusEl.textContent=s.val()?'Online':'Offline';
      statusEl.style.color=s.val()?'var(--green)':'var(--gray)';
    });
  }
  document.getElementById('chat-overlay').classList.add('active');
  loadChatMessages();
};

function loadChatMessages(){
  const msgDiv=document.getElementById('chat-messages');
  msgDiv.innerHTML='<div class="spinner"></div>';
  if(chatListener)off(chatListener);
  let msgRef;
  if(chatTarget.isGlobal){
    msgRef=query(ref(db,'chats'),limitToLast(60));
  } else {
    const key=privateKey(currentUser.uid,chatTarget.uid);
    msgRef=query(ref(db,`private_chats/${key}`),limitToLast(60));
  }
  chatListener=msgRef;
  onValue(msgRef,snap=>{
    msgDiv.innerHTML='';
    if(!snap.exists()){return;}
    snap.forEach(c=>{
      const m={id:c.key,...c.val()};
      msgDiv.appendChild(buildBubble(m));
    });
    msgDiv.scrollTop=msgDiv.scrollHeight;
  });
}

function buildBubble(m){
  const isMine=m.uid===currentUser.uid;
  const wrap=document.createElement('div');
  wrap.className=`bubble-wrap ${isMine?'mine':''}`;
  const isEdited=m.edited?'<span style="font-size:9px;color:rgba(0,0,0,0.3);"> (edited)</span>':'';
  const isGlobal=chatTarget.isGlobal;
  wrap.innerHTML=`
    ${!isMine?`<img class="bubble-avatar" src="${m.photo||`https://ui-avatars.com/api/?name=U&background=FFD600&color=333`}" onclick="openProfileViewer('${m.uid}')"/>`:''}
    <div>
      ${isGlobal&&!isMine?`<div class="bubble-sender">${m.user||'User'}</div>`:''}
      <div class="bubble ${isMine?'mine':'theirs'}">
        ${m.image?`<img src="${m.image}" onclick="viewImage('${m.image}')"/>`:''}
        ${m.text?`<span>${parseMentions(m.text)}${isEdited}</span>`:''}
        <div class="bubble-time">${timeAgo(m.timestamp)}</div>
        ${isMine?`<div class="bubble-actions">
          <button class="bubble-action-btn" onclick="editMessage('${m.id}','${m.text||''}')">Edit</button>
          <button class="bubble-action-btn" onclick="deleteMessage('${m.id}')">Del</button>
        </div>`:''}
      </div>
    </div>
    ${isMine?`<img class="bubble-avatar" src="${currentUser.photoURL||`https://ui-avatars.com/api/?name=Me&background=FFD600&color=333`}"/>`:''}
  `;
  return wrap;
}

  document.getElementById('stat-posts').textContent=postCount;
  const follSnap=await get(ref(db,`followers/${currentUser.uid}`));
  document.getElementById('stat-followers').textContent=follSnap.exists()?Object.keys(follSnap.val()).length:0;
  const follingSnap=await get(ref(db,`following/${currentUser.uid}`));
  document.getElementById('stat-following').textContent=follingSnap.exists()?Object.keys(follingSnap.val()).length:0;
  // Grid
  const grid=document.getElementById('my-posts-grid');
  grid.innerHTML='';
  if(postsSnap.exists()){
    postsSnap.forEach(c=>{
      const p=c.val();
      if(p.uid===currentUser.uid){
        const img=document.createElement('img');
        img.className='grid-img';
        img.src=p.type==='reel'?'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect fill="%23222" width="100" height="100"/><text x="50%" y="50%" fill="%23fff" text-anchor="middle" dy=".3em" font-size="30">🎬</text></svg>':p.image;
        img.onclick=()=>viewPostDetail(c.key,p);
        grid.appendChild(img);
      }
    });
  }
}

window.toggleEditProfile=function(){
  const form=document.getElementById('edit-profile-form');
  form.style.display=form.style.display==='none'?'block':'none';
  if(form.style.display==='block'){
    document.getElementById('edit-username-input').value=document.getElementById('my-username').textContent;
    document.getElementById('edit-bio-input').value=document.getElementById('my-bio').textContent;
  }
};

window.saveProfile=async function(){
  const newName=document.getElementById('edit-username-input').value.trim();
  const newBio=document.getElementById('edit-bio-input').value.trim();
  if(!newName){showToast('Username required');return;}
  await update(ref(db,`users/${currentUser.uid}`),{username:newName,bio:newBio});
  await updateProfile(auth.currentUser,{displayName:newName});
  document.getElementById('my-username').textContent=newName;
  document.getElementById('my-bio').textContent=newBio;
  document.getElementById('edit-profile-form').style.display='none';
  showToast('Profile updated!');
};

window.uploadAvatar=async function(e){
  const f=e.target.files[0];if(!f)return;
  showToast('Uploading avatar...');
  const b64=await processImage(f,300,0.8);
  await update(ref(db,`users/${currentUser.uid}`),{photo:b64});
  document.getElementById('my-avatar').src=b64;
  showToast('Avatar updated!');
  e.target.value='';
};

window.shareProfile=function(){
  const u=document.getElementById('my-username').textContent;
  const link=`${window.location.origin}${window.location.pathname}?u=${currentUser.uid}`;
  if(navigator.share){
    navigator.share({title:u,url:link});
  } else {
    navigator.clipboard.writeText(link);
    showToast('Profile link copied!');
  }
};

window.showFollowersList=async function(){
  const snap=await get(ref(db,`followers/${currentUser.uid}`));
  if(!snap.exists()){showModal('Followers','<p style="color:var(--gray);font-size:14px;text-align:center;padding:16px;">No followers yet</p>',()=>{});return;}
  let html='<div style="max-height:300px;overflow-y:auto;">';
  for(const uid of Object.keys(snap.val())){
    const us=await get(ref(db,`users/${uid}`));
    const u=us.val();
    html+=`<div onclick="openProfileViewer('${uid}');closeModal();" style="display:flex;align-items:center;gap:10px;padding:10px 0;cursor:pointer;border-bottom:1px solid #F3F4F6;">
      <img src="${u?.photo||''}" style="width:38px;height:38px;border-radius:50%;object-fit:cover;background:#eee;"/>
      <span style="font-weight:600;">${u?.username||'User'}</span>
    </div>`;
  }
  html+='</div>';
  showModal('Followers',html,()=>{});
};

// Highlights
window.addHighlight=function(){
  pendingHighlightName='';
  showModal('Add Highlight',`<input id="hl-name-inp" class="modal-input" placeholder="Highlight name (e.g. Travel)"/>`,()=>{
    pendingHighlightName=document.getElementById('hl-name-inp').value.trim()||'Highlight';
    document.getElementById('highlight-input').click();
  });
};

window.uploadHighlight=async function(e){
  const f=e.target.files[0];if(!f)return;
  const b64=await processImage(f,400,0.75);
  await push(ref(db,`highlights/${currentUser.uid}`),{
    name:pendingHighlightName||'Highlight',image:b64,timestamp:Date.now()
  });
  showToast('Highlight added!');loadHighlights();
  e.target.value='';
};

function loadHighlights(){
  if(!currentUser)return;
  const rail=document.getElementById('highlights-rail');
  onValue(ref(db,`highlights/${currentUser.uid}`),snap=>{
    rail.innerHTML='';
    if(!snap.exists())return;
    snap.forEach(c=>{
      const h=c.val();
      const item=document.createElement('div');
      item.className='highlight-item';
      item.innerHTML=`
        <div class="highlight-circle"><img src="${h.image}"/></div>
        <span class="highlight-label">${h.name||'Highlight'}</span>
      `;
      item.onclick=()=>showModal(h.name,`<img src="${h.image}" style="width:100%;border-radius:12px;"/><br/><button onclick="deleteHighlight('${c.key}');closeModal();" style="margin-top:10px;background:#FEE2E2;border:none;border-radius:8px;padding:7px 14px;font-size:12px;color:var(--red);cursor:pointer;">Delete Highlight</button>`,()=>{});
      rail.appendChild(item);
    });
  });
}

window.deleteHighlight=async function(hid){
  await remove(ref(db,`highlights/${currentUser.uid}/${hid}`));
  showToast('Removed');
};

window.logoutUser=async function(){
  showModal('Logout','<p style="font-size:14px;color:var(--gray);">Are you sure you want to logout?</p>',async()=>{
    setOnlineStatus(false);
    await signOut(auth);
    feedLoaded=false;
    document.getElementById('feed-container').innerHTML='';
    document.getElementById('stories-rail').innerHTML=`
      <div class="story-item" onclick="triggerStoryUpload()">
        <div class="story-add"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div>
        <span class="story-label">Add story</span>
      </div>`;
  });
};

// ─── Profile Viewer ───────────────────────────────────────────
window.openProfileViewer=async function(uid){
  if(!uid||uid===currentUser.uid){setView('profile');return;}
  pvTargetUid=uid;
  document.getElementById('profile-viewer').classList.add('active');
  const snap=await get(ref(db,`users/${uid}`));
  const u=snap.val()||{};
  document.getElementById('pv-avatar').src=u.photo||`https://ui-avatars.com/api/?name=${encodeURIComponent(u.username||'User')}&background=FFD600&color=333`;
  document.getElementById('pv-username').textContent=u.username||'User';
  document.getElementById('pv-bio').textContent=u.bio||'';
  document.getElementById('pv-king').style.display=uid===OWNER_UID?'inline':'none';
  document.getElementById('pv-vtick').style.display=u.verified?'inline-flex':'none';
  document.getElementById('admin-grant-btn').style.display=isOwner()?'block':'none';
  document.getElementById('ban-btn').style.display=isOwner()&&uid!==OWNER_UID?'block':'none';
  // Follow status
  const fs=await get(ref(db,`following/${currentUser.uid}/${uid}`));
  const fb=document.getElementById('pv-follow-btn');
  if(fs.exists()){fb.textContent='Following';fb.className='follow-btn following';}
  else{fb.textContent='Follow';fb.className='follow-btn follow';}
  // Stats
  const postsSnap=await get(ref(db,'posts'));
  let pc=0;if(postsSnap.exists())postsSnap.forEach(c=>{if(c.val().uid===uid)pc++;});
  document.getElementById('pv-posts').textContent=pc;
  const follSnap=await get(ref(db,`followers/${uid}`));
  document.getElementById('pv-followers').textContent=follSnap.exists()?Object.keys(follSnap.val()).length:0;
  const follingSnap=await get(ref(db,`following/${uid}`));
  document.getElementById('pv-following').textContent=follingSnap.exists()?Object.keys(follingSnap.val()).length:0;
  // Grid
  const pgrid=document.getElementById('pv-posts-grid');
  pgrid.innerHTML='';
  if(postsSnap.exists()){
    postsSnap.forEach(c=>{
      const p=c.val();
      if(p.uid===uid){
        const img=document.createElement('img');
        img.className='grid-img';
        img.src=p.type==='reel'?'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect fill="%23222" width="100" height="100"/><text x="50%" y="50%" fill="%23fff" text-anchor="middle" dy=".3em" font-size="30">🎬</text></svg>':p.image;
        pgrid.appendChild(img);
      }
    });
  }
};

window.closeProfileViewer=function(){
  document.getElementById('profile-viewer').classList.remove('active');
  pvTargetUid=null;
};

window.pvFollow=async function(){
  if(!pvTargetUid)return;
  await toggleFollow(pvTargetUid,'');
  const fs=await get(ref(db,`following/${currentUser.uid}/${pvTargetUid}`));
  const fb=document.getElementById('pv-follow-btn');
  if(fs.exists()){fb.textContent='Following';fb.className='follow-btn following';}
  else{fb.textContent='Follow';fb.className='follow-btn follow';}
};

window.pvMessage=function(){
  if(!pvTargetUid)return;
  get(ref(db,`users/${pvTargetUid}`)).then(snap=>{
    const u=snap.val();
    closeProfileViewer();
    openChat({uid:pvTargetUid,name:u?.username||'User',photo:u?.photo||'',isGlobal:false});
  });
};

window.pvShare=function(){
  const link=`${window.location.origin}${window.location.pathname}?u=${pvTargetUid}`;
  if(navigator.share)navigator.share({title:'Profile',url:link});
  else{navigator.clipboard.writeText(link);showToast('Link copied!');}
};

window.grantBlueTick=async function(){
  if(!isOwner()||!pvTargetUid)return;
  const snap=await get(ref(db,`users/${pvTargetUid}/verified`));
  await update(ref(db,`users/${pvTargetUid}`),{verified:!snap.val()});
  document.getElementById('pv-vtick').style.display=!snap.val()?'inline-flex':'none';
  showToast(!snap.val()?'Blue tick granted!':'Blue tick removed');
};

window.banUser=async function(){
  if(!isOwner()||!pvTargetUid)return;
  showModal('Ban User',`<input id="ban-reason-inp" class="modal-input" placeholder="Reason for ban"/>`,async()=>{
    const reason=document.getElementById('ban-reason-inp').value.trim()||'Policy violation';
    await update(ref(db,`users/${pvTargetUid}`),{banned:true,banReason:reason});
    showToast('User banned');
    closeProfileViewer();
  });
};

function viewPostDetail(pid, p){
  showModal('Post',`
    <img src="${p.image}" style="width:100%;border-radius:12px;margin-bottom:10px;"/>
    <p style="font-size:13px;">${p.caption||''}</p>
    ${(isOwner()||(currentUser&&p.uid===currentUser.uid))?`<button onclick="deletePost('${pid}');closeModal();" style="margin-top:10px;background:#FEE2E2;border:none;border-radius:8px;padding:7px 14px;font-size:12px;color:var(--red);cursor:pointer;font-weight:600;">Delete</button>`:''}
  `,()=>{});
}

// ─── Search ────────────────────────────────────────────────────
document.getElementById('search-btn').onclick=function(){
  document.getElementById('search-overlay').classList.add('active');
  document.getElementById('search-input').focus();
};
window.closeSearch=function(){
  document.getElementById('search-overlay').classList.remove('active');
};
window.searchUsers=async function(q){
  const res=document.getElementById('search-results');
  if(!q){res.innerHTML='';return;}
  const snap=await get(ref(db,'users'));
  res.innerHTML='';
  if(!snap.exists())return;
  snap.forEach(u=>{
    if(u.key===currentUser.uid)return;
    const ud=u.val();
    if((ud.username||'').toLowerCase().includes(q.toLowerCase())){
      const item=document.createElement('div');
      item.className='search-result';
      item.innerHTML=`
        <img src="${ud.photo||`https://ui-avatars.com/api/?name=${ud.username}&background=FFD600&color=333`}" style="width:40px;height:40px;border-radius:50%;object-fit:cover;"/>
        <div>
          <div style="font-weight:600;font-size:14px;display:flex;align-items:center;gap:4px;">${ud.username||'User'}${ud.verified?'<div class="vtick" style="width:13px;height:13px;"><svg viewBox="0 0 24 24" fill="none" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></div>':''}</div>
          <div style="font-size:12px;color:var(--gray);">${ud.bio||''}</div>
        </div>
      `;
      item.onclick=()=>{closeSearch();openProfileViewer(u.key);};
      res.appendChild(item);
    }
  });
};

// ─── Deep link handling ────────────────────────────────────────
const urlParams=new URLSearchParams(window.location.search);
if(urlParams.has('u')){
  onAuthStateChanged(auth,user=>{
    if(user){setTimeout(()=>openProfileViewer(urlParams.get('u')),1000);}
  });
}
if(urlParams.has('group')){
  const gid=urlParams.get('group');
  onAuthStateChanged(auth,async user=>{
    if(user){
      setTimeout(async()=>{
        await set(ref(db,`groups/${gid}/members/${user.uid}`),true);
        const gs=await get(ref(db,`groups/${gid}`));
        if(gs.exists())openGroupChat(gid,gs.val());
      },1200);
    }
  });
}

// Banner for banned user
onAuthStateChanged(auth,async user=>{
  if(user){
    const snap=await get(ref(db,`users/${user.uid}`));
    if(snap.val()?.banned){
      document.getElementById('app-view').innerHTML=`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;padding:32px;text-align:center;"><div style="font-size:48px;margin-bottom:16px;">🚫</div><h2 style="font-family:Sora,sans-serif;font-size:22px;margin-bottom:8px;">Account Banned</h2><p style="color:var(--gray);font-size:14px;">Reason: ${snap.val()?.banReason||'Policy violation'}</p><button onclick="logoutUser()" style="margin-top:24px;background:var(--yellow);border:none;border-radius:12px;padding:12px 24px;font-weight:700;cursor:pointer;">Logout</button></div>`;
    }
  }
});
</script>
</body>
</html>
