<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pain Bot — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --cyan:#4dd9f0;--purple:#9b7fe8;--dark:#080b18;
  --glass:rgba(255,255,255,0.05);--border:rgba(255,255,255,0.1);
  --text:#e8eaf6;--text2:#8b93b8;--text3:#3a4060;
  --red:#f06292;--green:#4ecca3;
}
body{
  font-family:'Nunito',sans-serif;
  background:var(--dark);color:var(--text);
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}

/* BG */
.bg{position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse at 15% 50%,rgba(76,45,160,0.4) 0%,transparent 55%),
    radial-gradient(ellipse at 85% 20%,rgba(30,160,200,0.2) 0%,transparent 50%),
    radial-gradient(ellipse at 60% 90%,rgba(100,40,180,0.25) 0%,transparent 50%),
    linear-gradient(180deg,#060810 0%,#0c0e1e 100%);
}
.stars{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    radial-gradient(1px 1px at 12% 25%,rgba(255,255,255,0.7) 0%,transparent 100%),
    radial-gradient(1px 1px at 35% 65%,rgba(255,255,255,0.5) 0%,transparent 100%),
    radial-gradient(1px 1px at 55% 12%,rgba(255,255,255,0.6) 0%,transparent 100%),
    radial-gradient(1px 1px at 75% 45%,rgba(255,255,255,0.4) 0%,transparent 100%),
    radial-gradient(1px 1px at 92% 78%,rgba(255,255,255,0.5) 0%,transparent 100%),
    radial-gradient(1px 1px at 18% 88%,rgba(255,255,255,0.4) 0%,transparent 100%),
    radial-gradient(2px 2px at 28% 38%,rgba(77,217,240,0.7) 0%,transparent 100%),
    radial-gradient(2px 2px at 68% 55%,rgba(155,127,232,0.7) 0%,transparent 100%),
    radial-gradient(1.5px 1.5px at 48% 72%,rgba(255,255,255,0.5) 0%,transparent 100%),
    radial-gradient(1px 1px at 82% 15%,rgba(255,255,255,0.6) 0%,transparent 100%);
}
.light{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0;animation:flt 9s ease-in-out infinite;}
.l1{width:350px;height:350px;top:0%;left:0%;background:rgba(77,217,240,0.08);animation-delay:0s;}
.l2{width:450px;height:450px;top:10%;right:5%;background:rgba(124,92,191,0.12);animation-delay:-4s;}
.l3{width:280px;height:280px;bottom:10%;left:25%;background:rgba(77,217,240,0.07);animation-delay:-7s;}
@keyframes flt{0%,100%{transform:translateY(0);}50%{transform:translateY(-25px);}}

/* CARD */
.card{
  position:relative;z-index:1;
  width:420px;max-width:93vw;
  background:rgba(255,255,255,0.04);
  border:1px solid var(--border);
  border-radius:28px;padding:50px 42px 42px;
  backdrop-filter:blur(24px);
  box-shadow:0 40px 100px rgba(0,0,0,0.5),0 0 0 1px rgba(255,255,255,0.05) inset;
  animation:up 0.5s cubic-bezier(.16,1,.3,1);
}
@keyframes up{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}

.logo{
  width:70px;height:70px;border-radius:20px;margin:0 auto 22px;
  background:linear-gradient(135deg,var(--cyan),var(--purple));
  display:flex;align-items:center;justify-content:center;font-size:32px;
  box-shadow:0 12px 40px rgba(77,217,240,0.35);
}
.ttl{font-size:30px;font-weight:900;text-align:center;color:#fff;margin-bottom:6px;}
.ttl span{background:linear-gradient(90deg,var(--cyan),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.sub{font-size:12px;color:var(--text2);text-align:center;letter-spacing:2px;margin-bottom:36px;font-family:'Space Mono',monospace;}

.lbl{font-size:11px;font-weight:700;color:var(--text2);letter-spacing:1.5px;text-transform:uppercase;display:block;margin-bottom:8px;font-family:'Space Mono',monospace;}
.inp{
  width:100%;padding:13px 18px;margin-bottom:16px;
  background:rgba(255,255,255,0.06);
  border:1px solid var(--border);border-radius:14px;
  color:var(--text);font-size:14px;font-family:'Nunito',sans-serif;
  outline:none;transition:all 0.25s;
}
.inp:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(77,217,240,0.12);}
.inp::placeholder{color:var(--text3);}

.err-msg{
  background:rgba(240,98,146,0.12);border:1px solid rgba(240,98,146,0.25);
  border-radius:10px;padding:10px 14px;
  font-size:12px;color:var(--red);margin-bottom:14px;
  display:none;align-items:center;gap:8px;
}
.err-msg.show{display:flex;}

.btn{
  width:100%;padding:14px;border-radius:50px;
  background:linear-gradient(135deg,var(--cyan),var(--purple));
  border:none;color:#fff;font-size:15px;font-weight:800;
  font-family:'Nunito',sans-serif;cursor:pointer;
  box-shadow:0 6px 26px rgba(77,217,240,0.3);
  transition:all 0.25s;letter-spacing:0.3px;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 36px rgba(77,217,240,0.45);}
.btn:active{transform:translateY(0);}
.btn.loading{opacity:0.7;pointer-events:none;}

.divider{display:flex;align-items:center;gap:12px;margin:22px 0;color:var(--text3);font-size:12px;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}

.note{font-size:11px;color:var(--text3);text-align:center;font-family:'Space Mono',monospace;line-height:1.7;}

/* Spinner */
.spin{width:18px;height:18px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite;display:none;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="bg"></div>
<div class="stars"></div>
<div class="light l1"></div>
<div class="light l2"></div>
<div class="light l3"></div>

<div class="card">
  <div class="logo">🤖</div>
  <div class="ttl">Pain <span>Bot</span></div>
  <div class="sub">// ADMIN CONTROL PANEL</div>

  <div class="err-msg" id="errMsg">❌ <span id="errTxt">Invalid password</span></div>

  <label class="lbl">Admin Password</label>
  <input type="password" class="inp" id="passIn" placeholder="Enter your password..." onkeydown="if(event.key==='Enter')doLogin()"/>

  <button class="btn" id="loginBtn" onclick="doLogin()">
    <div class="spin" id="spinner"></div>
    <span id="btnTxt">🔓 Access Dashboard</span>
  </button>

  <div class="divider">secure access</div>
  <div class="note">
    This panel is restricted to authorized admins only.<br/>
    All actions are logged and monitored.
  </div>
</div>

<script>
// Store password hash for comparison (more secure than plain text)
const CORRECT_PASS = "BhaiKaSystem"; // Change this to your ADMIN_PASS

function doLogin(){
  const pass = document.getElementById('passIn').value;
  const btn  = document.getElementById('loginBtn');
  const spin = document.getElementById('spinner');
  const btxt = document.getElementById('btnTxt');
  const err  = document.getElementById('errMsg');

  if(!pass){ showErr('Password cannot be empty!'); return; }

  // Loading state
  btn.classList.add('loading');
  spin.style.display = 'block';
  btxt.textContent   = 'Verifying...';
  err.classList.remove('show');

  setTimeout(()=>{
    if(pass === CORRECT_PASS){
      // Store auth token with timestamp
      const token = btoa(Date.now() + ':' + pass.length);
      sessionStorage.setItem('painbot_auth', token);
      sessionStorage.setItem('painbot_time', Date.now());
      window.location.href = 'dashboard.html';
    } else {
      btn.classList.remove('loading');
      spin.style.display = 'none';
      btxt.textContent   = '🔓 Access Dashboard';
      document.getElementById('passIn').value = '';
      showErr('Wrong password! Access denied.');
    }
  }, 800);
}

function showErr(msg){
  const e = document.getElementById('errMsg');
  document.getElementById('errTxt').textContent = msg;
  e.classList.add('show');
  setTimeout(()=> e.classList.remove('show'), 4000);
}

// If already logged in, redirect
if(sessionStorage.getItem('painbot_auth')){
  window.location.href = 'dashboard.html';
}
</script>
</body>
</html>
