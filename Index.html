<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Knowledge Pro - Infinite Void</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* CSS Variables for Theme */
        :root {
            --gojo-red: #D00000;
            --gojo-black: #050505;
            --gojo-violet: #8A2BE2;
            --glass: rgba(15, 15, 15, 0.8);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--gojo-black);
            color: white;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        /* Loading Screen */
        #loading {
            position: fixed;
            inset: 0;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            font-size: 1.5rem;
            letter-spacing: 5px;
            color: var(--gojo-red);
            text-transform: uppercase;
        }

        /* Canvas Background - Infinite Void */
        #void-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        /* Glassmorphism Classes */
        .glass-panel {
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chat-container {
            height: calc(100dvh - 80px); /* Dynamic viewport height for mobile keyboard */
        }

        .user-msg {
            align-self: flex-end;
            background: rgba(208, 0, 0, 0.2);
            border: 1px solid var(--gojo-red);
            border-radius: 15px 15px 0 15px;
            box-shadow: 0 0 10px rgba(208, 0, 0, 0.3);
        }

        .ai-msg {
            align-self: flex-start;
            background: rgba(138, 43, 226, 0.1);
            border: 1px solid var(--gojo-violet);
            border-radius: 15px 15px 15px 0;
            box-shadow: 0 0 10px rgba(138, 43, 226, 0.2);
        }

        /* Sidebar transitions */
        #sidebar {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--gojo-red); border-radius: 10px; }

        pre {
            background: #1a1a1a !important;
            padding: 10px;
            border-radius: 8px;
            overflow-x: auto;
            border: 1px solid #333;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            background: var(--gojo-violet);
            border-radius: 50%;
            display: inline-block;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <canvas id="void-canvas"></canvas>

    <div id="loading">DOMAIN EXPANSION...</div>

    <div id="auth-screen" class="fixed inset-0 z-[100] bg-black flex flex-col items-center justify-center p-4 hidden">
        <div class="glass-panel p-8 rounded-2xl w-full max-w-md border-red-900 border-2 text-center">
            <h1 class="text-4xl font-bold text-red-600 mb-6">KNOWLEDGE PRO</h1>
            <p class="text-gray-400 mb-8">Enter your credentials to enter the Infinite Void</p>
            <input type="email" id="email" placeholder="Email" class="w-full bg-zinc-900 border border-zinc-700 p-3 rounded mb-4 focus:outline-none focus:border-red-600">
            <input type="password" id="password" placeholder="Password" class="w-full bg-zinc-900 border border-zinc-700 p-3 rounded mb-6 focus:outline-none focus:border-red-600">
            <button onclick="handleLogin()" class="w-full bg-red-700 hover:bg-red-600 text-white font-bold py-3 rounded transition-all">LOGIN</button>
            <p id="auth-error" class="text-red-500 mt-4 text-sm"></p>
        </div>
    </div>

    <div id="app-ui" class="flex flex-1 overflow-hidden opacity-0 transition-opacity duration-1000">
        
        <aside id="sidebar" class="fixed lg:relative z-50 w-72 h-full glass-panel border-r border-zinc-800 -translate-x-full lg:translate-x-0 flex flex-col">
            <div class="p-4 border-b border-zinc-800 flex justify-between items-center">
                <button onclick="createNewChat()" class="flex-1 flex items-center justify-center gap-2 border border-red-900 hover:bg-red-900/20 py-2 rounded transition-all">
                    <i class="fas fa-plus"></i> New Chat
                </button>
                <button onclick="toggleSidebar()" class="lg:hidden ml-2 text-xl"><i class="fas fa-times"></i></button>
            </div>
            <div id="chat-history" class="flex-1 overflow-y-auto p-2 space-y-1">
                </div>
            <div class="p-4 border-t border-zinc-800 space-y-2">
                <button onclick="openSettings()" class="w-full text-left p-2 hover:bg-zinc-800 rounded flex items-center gap-3">
                    <i class="fas fa-cog"></i> Settings
                </button>
                <div id="admin-menu" class="hidden">
                    <button onclick="openAdminPanel()" class="w-full text-left p-2 text-red-500 hover:bg-red-900/10 rounded flex items-center gap-3">
                        <i class="fas fa-user-shield"></i> Admin Panel
                    </button>
                </div>
                <button onclick="handleLogout()" class="w-full text-left p-2 text-gray-400 hover:bg-zinc-800 rounded flex items-center gap-3">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col relative min-w-0">
            <header class="p-4 glass-panel border-b border-zinc-800 flex items-center justify-between">
                <button onclick="toggleSidebar()" class="lg:hidden text-2xl"><i class="fas fa-bars"></i></button>
                <div class="flex items-center gap-2">
                    <span id="current-model-name" class="font-bold text-red-500">Knowledge v1</span>
                    <span id="admin-badge" class="hidden text-blue-500"><i class="fas fa-check-circle"></i></span>
                </div>
                <button onclick="toggleDarkMode()" class="text-xl"><i class="fas fa-moon"></i></button>
            </header>

            <div id="messages" class="flex-1 overflow-y-auto p-4 lg:p-8 space-y-6 flex flex-col">
                </div>

            <div class="p-4 bg-transparent">
                <div class="max-w-4xl mx-auto relative glass-panel rounded-2xl border border-zinc-700 p-2 flex items-end gap-2 shadow-2xl">
                    <select id="model-selector" class="bg-zinc-900 text-xs border-none p-2 rounded focus:ring-0 cursor-pointer mb-1">
                        <option value="v1">v1 (Default)</option>
                    </select>
                    <textarea id="userInput" rows="1" placeholder="Send a message..." class="flex-1 bg-transparent border-none focus:ring-0 p-2 resize-none max-h-40 overflow-y-auto text-white"></textarea>
                    <button onclick="sendMessage()" class="bg-red-700 hover:bg-red-600 text-white w-10 h-10 rounded-xl flex items-center justify-center transition-all mb-1">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
                <p class="text-[10px] text-center text-gray-500 mt-2">Infinite Void System | Property of Gojo Satoru</p>
            </div>
        </main>
    </div>

    <div id="modal-overlay" class="fixed inset-0 bg-black/80 z-[200] hidden flex items-center justify-center p-4">
        <div class="glass-panel w-full max-w-2xl rounded-2xl overflow-hidden max-h-[90vh] flex flex-col">
            <div class="p-4 border-b border-zinc-800 flex justify-between items-center bg-zinc-900">
                <h2 id="modal-title" class="text-xl font-bold">Settings</h2>
                <button onclick="closeModal()" class="text-2xl">&times;</button>
            </div>
            <div id="modal-content" class="p-6 overflow-y-auto flex-1">
                </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>

    <script>
        // --- 1. CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyBD473HnZjcmuBlEwd7uaI0MB-hKU4_Nfs",
            authDomain: "knowledge-pro-c9ee5.firebaseapp.com",
            databaseURL: "https://knowledge-pro-c9ee5-default-rtdb.firebaseio.com",
            projectId: "knowledge-pro-c9ee5",
            storageBucket: "knowledge-pro-c9ee5.firebasestorage.app",
            messagingSenderId: "14035001235",
            appId: "1:14035001235:web:cb7c8a0d7c0ce48d729266"
        };

        // --- 2. INITIALIZATION ---
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        let currentUser = null;
        let isAdmin = false;
        let currentChatId = 'default';

        // --- 3. INFINITE VOID CANVAS ANIMATION ---
        const canvas = document.getElementById('void-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            particles = [];
            for(let i=0; i<200; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    z: Math.random() * canvas.width,
                    o: Math.random()
                });
            }
        }

        function drawCanvas() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            particles.forEach(p => {
                p.z -= 5;
                if(p.z <= 0) p.z = canvas.width;

                const sx = (p.x - centerX) * (canvas.width / p.z) + centerX;
                const sy = (p.y - centerY) * (canvas.width / p.z) + centerY;
                const size = (1 - p.z / canvas.width) * 5;

                ctx.beginPath();
                ctx.fillStyle = p.o > 0.5 ? '#fff' : '#8A2BE2';
                ctx.arc(sx, sy, size, 0, Math.PI * 2);
                ctx.fill();
            });
            requestAnimationFrame(drawCanvas);
        }

        // --- 4. AUTH LOGIC ---
        auth.onAuthStateChanged(user => {
            document.getElementById('loading').classList.add('hidden');
            if (user) {
                currentUser = user;
                checkAdminStatus();
                showApp();
            } else {
                showAuth();
            }
        });

        async function handleLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                await auth.signInWithEmailAndPassword(email, password);
            } catch (error) {
                document.getElementById('auth-error').innerText = error.message;
            }
        }

        function handleLogout() {
            auth.signOut();
            location.reload();
        }

        async function checkAdminStatus() {
            // Static check based on prompt: "only admins can edit"
            // For production, this should be a role in Database
            const snapshot = await db.ref('admins/' + currentUser.uid).once('value');
            if (snapshot.exists()) {
                isAdmin = true;
                document.getElementById('admin-menu').classList.remove('hidden');
                document.getElementById('admin-badge').classList.remove('hidden');
            }
        }

        // --- 5. CHAT LOGIC ---
        async function sendMessage() {
            const inputField = document.getElementById("userInput");
            const message = inputField.value.trim();
            const messagesDiv = document.getElementById("messages");
            const model = document.getElementById('model-selector').value;

            if (!message) return;

            // Check if Banned
            const banCheck = await db.ref('banned/' + currentUser.uid).once('value');
            if (banCheck.exists()) {
                alert("You are banned by admin");
                return;
            }

            // UI Update: User Message
            const userMsgHtml = `
                <div class="user-msg p-4 max-w-[85%] animate-fade-in">
                    <b>You:</b><br>${message}
                </div>`;
            messagesDiv.innerHTML += userMsgHtml;
            inputField.value = "";
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            // AI Typing Indicator
            const aiId = 'ai-' + Date.now();
            messagesDiv.innerHTML += `
                <div id="${aiId}" class="ai-msg p-4 max-w-[85%]">
                    <b>AI:</b> <span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>
                </div>`;

            try {
                const response = await fetch("https://ai-bot-brain.onrender.com/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: message, model: model })
                });

                const data = await response.json();
                const aiMsgElement = document.getElementById(aiId);
                
                // Typing Animation Simulation
                aiMsgElement.innerHTML = `<b>AI (${model}):</b><br><div class="markdown-body"></div>`;
                const body = aiMsgElement.querySelector('.markdown-body');
                
                let i = 0;
                const stream = data.reply;
                const interval = setInterval(() => {
                    body.innerHTML = marked.parse(stream.substring(0, i));
                    i += 2;
                    messagesDiv.scrollTop = messagesDiv.scrollHeight;
                    if(i >= stream.length + 2) clearInterval(interval);
                }, 10);

                // Persist to Firebase
                db.ref(`chats/${currentUser.uid}/${currentChatId}/history`).push({
                    role: 'user', text: message, timestamp: Date.now()
                });
                db.ref(`chats/${currentUser.uid}/${currentChatId}/history`).push({
                    role: 'ai', text: data.reply, timestamp: Date.now()
                });

            } catch (error) {
                document.getElementById(aiId).innerHTML = `<span style='color:red;'>Error connecting to Infinite Void</span>`;
            }
        }

        // --- 6. UI HELPERS ---
        function toggleSidebar() {
            const sb = document.getElementById('sidebar');
            sb.classList.toggle('-translate-x-full');
        }

        function showAuth() {
            document.getElementById('auth-screen').classList.remove('hidden');
            document.getElementById('app-ui').classList.add('hidden');
        }

        function showApp() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-ui').classList.remove('hidden');
            document.getElementById('app-ui').classList.add('opacity-100');
            initCanvas();
            drawCanvas();
        }

        function openSettings() {
            const overlay = document.getElementById('modal-overlay');
            const content = document.getElementById('modal-content');
            document.getElementById('modal-title').innerText = "User Settings";
            
            content.innerHTML = `
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm text-gray-400">System Prompt</label>
                        <textarea id="sys-prompt" class="w-full bg-zinc-900 border border-zinc-700 p-2 rounded mt-1" placeholder="Define AI behavior..."></textarea>
                    </div>
                    <button onclick="saveSystemPrompt()" class="bg-red-700 px-4 py-2 rounded">Save Preferences</button>
                    <hr class="border-zinc-800">
                    <button onclick="openReportModal()" class="text-yellow-500 underline">Report a Bug/Response</button>
                </div>
            `;
            overlay.classList.remove('hidden');
        }

        function openAdminPanel() {
            if(!isAdmin) return;
            const overlay = document.getElementById('modal-overlay');
            const content = document.getElementById('modal-content');
            document.getElementById('modal-title').innerText = "Admin Special Grade Command";
            
            content.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="p-4 border border-zinc-700 rounded bg-black">
                        <h3 class="font-bold text-red-500 mb-2">Model Management</h3>
                        <button class="w-full text-left p-2 hover:bg-zinc-800 text-sm">Add New Model (v2, v3)</button>
                        <button class="w-full text-left p-2 hover:bg-zinc-800 text-sm">Set Expiry Rules</button>
                    </div>
                    <div class="p-4 border border-zinc-700 rounded bg-black">
                        <h3 class="font-bold text-red-500 mb-2">User History</h3>
                        <button class="w-full text-left p-2 hover:bg-zinc-800 text-sm">View All User Logs</button>
                        <button class="w-full text-left p-2 hover:bg-zinc-800 text-sm">Ban/Unban Users</button>
                    </div>
                    <div class="p-4 border border-zinc-700 rounded bg-black">
                        <h3 class="font-bold text-red-500 mb-2">Reports</h3>
                        <div id="admin-reports-list" class="text-xs text-gray-400">Loading reports...</div>
                    </div>
                </div>
            `;
            overlay.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.add('hidden');
        }

        // Window resize for Canvas
        window.addEventListener('resize', initCanvas);

        // Auto-focus input
        window.onload = () => {
            document.getElementById('userInput').focus();
        };

    </script>
</body>
</html>
