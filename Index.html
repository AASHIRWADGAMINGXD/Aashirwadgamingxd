<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Knowledge Pro | AI Chat</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            900: '#0c4a6e',
                        },
                        dark: {
                            bg: '#131314',
                            surface: '#1e1f20',
                            input: '#2d2e2f'
                        }
                    }
                }
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #4b5563; }

        /* Loader */
        #loading {
            position: fixed; inset: 0; z-index: 9999;
            background: #ffffff; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            transition: opacity 0.5s ease;
        }
        .dark #loading { background: #131314; color: white; }
        .spinner {
            width: 40px; height: 40px; border: 4px solid #e2e8f0;
            border-top: 4px solid #0ea5e9; border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Typing Cursor */
        .typing-cursor::after {
            content: '▋';
            animation: blink 1s step-start infinite;
            color: #0ea5e9;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* Markdown Styles */
        .prose pre { background: #1e293b; color: #f8fafc; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; }
        .prose code { background: #e2e8f0; padding: 0.2rem 0.4rem; border-radius: 0.25rem; font-size: 0.9em; }
        .dark .prose code { background: #374151; color: #e5e7eb; }
        .prose p { margin-bottom: 0.5rem; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-dark-bg dark:text-gray-200 transition-colors duration-200 h-dvh flex overflow-hidden">

    <div id="loading">
        <div class="spinner mb-4"></div>
        <div class="text-lg font-semibold animate-pulse">Initializing Knowledge Pro...</div>
    </div>

    <div id="auth-modal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="bg-white dark:bg-dark-surface p-8 rounded-2xl shadow-2xl w-full max-w-md border border-gray-200 dark:border-gray-700">
            <h2 class="text-2xl font-bold mb-2 text-center text-brand-600">Knowledge Pro</h2>
            <p class="text-gray-500 text-center mb-6 text-sm">Sign in to continue chatting</p>
            
            <form id="auth-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Email</label>
                    <input type="email" id="auth-email" class="w-full p-3 rounded-lg border dark:bg-dark-input dark:border-gray-600 focus:ring-2 focus:ring-brand-500 outline-none" placeholder="name@example.com" required>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Password</label>
                    <input type="password" id="auth-pass" class="w-full p-3 rounded-lg border dark:bg-dark-input dark:border-gray-600 focus:ring-2 focus:ring-brand-500 outline-none" placeholder="••••••••" required>
                </div>
                <button type="submit" class="w-full bg-brand-600 hover:bg-brand-500 text-white font-bold py-3 rounded-lg transition-all shadow-lg shadow-brand-500/30">
                    Enter Application
                </button>
            </form>
            <p id="auth-error" class="text-red-500 text-sm mt-4 text-center hidden"></p>
        </div>
    </div>

    <div id="app-container" class="flex w-full h-full opacity-0 transition-opacity duration-500">
        
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-72 bg-gray-100 dark:bg-dark-surface transform -translate-x-full md:translate-x-0 transition-transform duration-300 flex flex-col border-r border-gray-200 dark:border-gray-700">
            <div class="p-4 flex items-center justify-between">
                <div class="flex items-center gap-2 text-brand-600 font-bold text-xl">
                    <i class="ri-brain-fill"></i> <span>Knowledge Pro</span>
                </div>
                <button id="close-sidebar-btn" class="md:hidden p-2 text-gray-500 hover:text-gray-800 dark:hover:text-white">
                    <i class="ri-close-line text-2xl"></i>
                </button>
            </div>

            <div class="px-4 mb-4">
                <button id="new-chat-btn" class="w-full flex items-center justify-center gap-2 bg-white dark:bg-dark-input hover:bg-gray-50 dark:hover:bg-gray-700 py-3 rounded-full shadow-sm border border-gray-200 dark:border-gray-600 transition-colors">
                    <i class="ri-add-line"></i> <span class="text-sm font-medium">New chat</span>
                </button>
            </div>

            <div class="flex-1 overflow-y-auto px-2 space-y-1" id="chat-history-list"></div>

            <div class="p-4 border-t border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-dark-surface">
                <div id="user-profile" class="flex items-center gap-3 cursor-pointer p-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition">
                    <div class="w-8 h-8 rounded-full bg-brand-500 flex items-center justify-center text-white font-bold text-xs" id="user-avatar">U</div>
                    <div class="flex-1 overflow-hidden">
                        <p class="text-sm font-medium truncate" id="user-email">user@email.com</p>
                        <p class="text-xs text-gray-500" id="user-role">User</p>
                    </div>
                    <i class="ri-settings-4-line text-gray-400"></i>
                </div>
                
                <div id="settings-menu" class="hidden mt-2 space-y-1 text-sm">
                    <button id="btn-theme" class="w-full text-left p-2 hover:bg-gray-200 dark:hover:bg-gray-700 rounded"><i class="ri-moon-line mr-2"></i> Toggle Theme</button>
                    <button id="btn-admin" class="hidden w-full text-left p-2 hover:bg-gray-200 dark:hover:bg-gray-700 rounded text-brand-600"><i class="ri-admin-line mr-2"></i> Admin Panel</button>
                    <button id="btn-logout" class="w-full text-left p-2 hover:bg-red-100 dark:hover:bg-red-900/30 text-red-500 rounded"><i class="ri-logout-box-line mr-2"></i> Logout</button>
                </div>
            </div>
        </aside>

        <main class="flex-1 flex flex-col relative w-full md:ml-72 bg-white dark:bg-dark-bg h-full">
            
            <div class="md:hidden flex items-center justify-between p-4 border-b border-gray-200 dark:border-gray-700">
                <button id="mobile-menu-btn" class="text-gray-600 dark:text-gray-300">
                    <i class="ri-menu-line text-2xl"></i>
                </button>
                <span class="font-bold text-lg">Knowledge Pro</span>
                <div class="w-6"></div>
            </div>

            <div class="absolute top-4 left-1/2 transform -translate-x-1/2 z-10 hidden md:block">
                <button id="model-selector-btn" class="flex items-center gap-2 px-4 py-2 bg-gray-100 dark:bg-dark-surface rounded-lg text-sm font-medium shadow-sm hover:bg-gray-200 dark:hover:bg-gray-700 transition">
                    <span id="current-model-name">Standard Model</span>
                    <i class="ri-arrow-down-s-line"></i>
                </button>
                <div id="model-dropdown" class="hidden absolute top-12 left-0 w-48 bg-white dark:bg-dark-surface rounded-lg shadow-xl border border-gray-200 dark:border-gray-700 overflow-hidden py-1"></div>
            </div>

            <div id="messages-container" class="flex-1 overflow-y-auto p-4 md:p-8 scroll-smooth pb-32">
                <div id="welcome-screen" class="h-full flex flex-col items-center justify-center text-center opacity-80">
                    <div class="w-16 h-16 bg-gradient-to-tr from-blue-400 to-brand-600 rounded-2xl mb-4 shadow-lg animate-pulse"></div>
                    <h1 class="text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-500 to-purple-500 mb-2">Hello, Human</h1>
                    <p class="text-gray-500 dark:text-gray-400">How can I help you today?</p>
                </div>
            </div>

            <div class="flex-none p-4 bg-white dark:bg-dark-bg">
                <div class="max-w-4xl mx-auto relative">
                    <div class="bg-gray-100 dark:bg-dark-input rounded-3xl flex items-end p-2 border border-transparent focus-within:border-gray-300 dark:focus-within:border-gray-600 transition-colors">
                        <button class="p-2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 rounded-full transition">
                            <i class="ri-add-circle-line text-2xl"></i>
                        </button>
                        <textarea id="chat-input" rows="1" class="flex-1 bg-transparent border-none outline-none resize-none py-3 px-2 max-h-32 text-gray-800 dark:text-white placeholder-gray-500" placeholder="Enter a prompt here..."></textarea>
                        <button id="send-btn" class="p-2 mb-0.5 text-brand-500 hover:text-brand-600 disabled:opacity-50 disabled:cursor-not-allowed transition">
                            <i class="ri-send-plane-2-fill text-2xl"></i>
                        </button>
                    </div>
                    <p class="text-center text-xs text-gray-400 mt-2">Knowledge Pro may display inaccurate info.</p>
                </div>
            </div>
        </main>
    </div>

    <div id="admin-panel" class="hidden fixed inset-0 z-50 bg-white dark:bg-dark-bg flex flex-col overflow-hidden">
        <div class="p-4 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center bg-gray-50 dark:bg-dark-surface">
            <h2 class="text-xl font-bold text-brand-600 flex items-center gap-2"><i class="ri-admin-fill"></i> Admin Dashboard</h2>
            <button id="close-admin" class="p-2 hover:bg-gray-200 dark:hover:bg-gray-600 rounded-full"><i class="ri-close-line text-2xl"></i></button>
        </div>
        <div class="flex-1 flex overflow-hidden">
            <div class="w-16 md:w-64 bg-gray-100 dark:bg-dark-surface border-r border-gray-200 dark:border-gray-700 flex flex-col">
                <nav class="flex-1 p-2 space-y-1">
                    <button onclick="switchAdminTab('training')" class="admin-tab-btn w-full text-left p-3 rounded hover:bg-white dark:hover:bg-gray-700 flex items-center gap-3 bg-white dark:bg-gray-800 shadow-sm"><i class="ri-database-2-line"></i> <span class="hidden md:inline">Training Data</span></button>
                    <button onclick="switchAdminTab('models')" class="admin-tab-btn w-full text-left p-3 rounded hover:bg-white dark:hover:bg-gray-700 flex items-center gap-3"><i class="ri-cpu-line"></i> <span class="hidden md:inline">Models</span></button>
                    <button onclick="switchAdminTab('users')" class="admin-tab-btn w-full text-left p-3 rounded hover:bg-white dark:hover:bg-gray-700 flex items-center gap-3"><i class="ri-user-settings-line"></i> <span class="hidden md:inline">User Management</span></button>
                </nav>
            </div>
            <div class="flex-1 overflow-y-auto p-6 bg-gray-50 dark:bg-dark-bg">
                <div id="admin-training" class="admin-section">
                    <h3 class="text-2xl font-bold mb-4">AI Training Center</h3>
                    <div class="bg-white dark:bg-dark-surface p-6 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 mb-6">
                        <div class="grid gap-4">
                            <input type="text" id="train-keywords" placeholder="Keywords" class="w-full p-3 rounded border dark:bg-dark-input dark:border-gray-600">
                            <textarea id="train-answer" rows="4" placeholder="AI Response" class="w-full p-3 rounded border dark:bg-dark-input dark:border-gray-600"></textarea>
                            <button id="btn-save-training" class="bg-green-600 hover:bg-green-500 text-white px-4 py-2 rounded">Save</button>
                        </div>
                    </div>
                    <div id="training-list" class="space-y-2 max-h-96 overflow-y-auto"></div>
                </div>
                <div id="admin-models" class="admin-section hidden">...</div>
                <div id="admin-users" class="admin-section hidden">...</div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        // --- 1. CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyBD473HnZjcmuBlEwd7uaI0MB-hKU4_Nfs",
            authDomain: "knowledge-pro-c9ee5.firebaseapp.com",
            databaseURL: "https://knowledge-pro-c9ee5-default-rtdb.firebaseio.com",
            projectId: "knowledge-pro-c9ee5",
            storageBucket: "knowledge-pro-c9ee5.firebasestorage.app",
            messagingSenderId: "14035001235",
            appId: "1:14035001235:web:cb7c8a0d7c0ce48d729266"
        };

        const RENDER_API_URL = "https://your-app-name.onrender.com/chat"; // अपना URL यहाँ बदलें

        // --- 2. INITIALIZATION ---
        let app = firebase.initializeApp(firebaseConfig);
        let auth = firebase.auth();
        let db = firebase.database();
        let currentUser = null, currentUserData = null, currentChatId = null;
        let currentModel = { id: 'default', name: 'Knowledge Model', access: 'free' };

        const els = {
            loading: document.getElementById('loading'),
            authModal: document.getElementById('auth-modal'),
            authForm: document.getElementById('auth-form'),
            appContainer: document.getElementById('app-container'),
            sidebar: document.getElementById('sidebar'),
            msgContainer: document.getElementById('messages-container'),
            input: document.getElementById('chat-input'),
            sendBtn: document.getElementById('send-btn'),
            historyList: document.getElementById('chat-history-list'),
            mobileMenuBtn: document.getElementById('mobile-menu-btn'),
            closeSidebarBtn: document.getElementById('close-sidebar-btn'),
            userProfile: document.getElementById('user-profile'),
            settingsMenu: document.getElementById('settings-menu'),
            newChatBtn: document.getElementById('new-chat-btn'),
            adminPanel: document.getElementById('admin-panel'),
            adminBtn: document.getElementById('btn-admin'),
            modelSelector: document.getElementById('model-selector-btn'),
            modelDropdown: document.getElementById('model-dropdown'),
            currentModelName: document.getElementById('current-model-name')
        };

        // --- 3. AUTH & UI ---
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                db.ref('users/' + user.uid).on('value', (snapshot) => {
                    currentUserData = snapshot.val() || {role: 'user'};
                    if (currentUserData.role === 'admin') els.adminBtn.classList.remove('hidden');
                    initUI();
                });
                els.authModal.classList.add('hidden');
            } else {
                els.authModal.classList.remove('hidden');
                els.authModal.classList.add('flex');
            }
        });

        function initUI() {
            els.loading.style.display = 'none';
            els.appContainer.classList.add('opacity-100');
            document.getElementById('user-email').textContent = currentUser.email;
            loadHistory();
        }

        els.authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-pass').value;
            try { await auth.signInWithEmailAndPassword(email, pass); } 
            catch { await auth.createUserWithEmailAndPassword(email, pass); }
        });

        // --- 4. CHAT LOGIC ---
        els.sendBtn.addEventListener('click', handleSend);
        els.input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); } });

        async function handleSend() {
            const text = els.input.value.trim();
            if (!text || (currentUserData && currentUserData.isBanned)) return;

            els.input.value = '';
            document.getElementById('welcome-screen').classList.add('hidden');

            if (!currentChatId) {
                const newChatRef = db.ref('chats').push();
                currentChatId = newChatRef.key;
                await newChatRef.set({ userId: currentUser.uid, title: text.substring(0, 30), timestamp: firebase.database.ServerValue.TIMESTAMP });
            }

            appendMessage('user', text);
            saveMessage('user', text);
            processAIResponse(text);
        }

        // --- 5. AI RESPONSE (THE BRAIN WITH RENDER API) ---
        async function processAIResponse(query) {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'flex justify-start w-full mb-6';
            typingDiv.innerHTML = `<div class="bg-white dark:bg-dark-surface p-4 rounded-2xl rounded-tl-none shadow-sm flex items-center gap-2">
                <i class="ri-robot-2-line text-brand-500"></i><span class="text-gray-500 text-sm animate-pulse">Thinking...</span></div>`;
            els.msgContainer.appendChild(typingDiv);
            els.msgContainer.scrollTop = els.msgContainer.scrollHeight;

            try {
                const response = await fetch(RENDER_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: query })
                });
                const data = await response.json();
                typingDiv.remove();
                streamAIResponse(data.reply || "No reply from AI.");
            } catch (error) {
                typingDiv.remove();
                appendMessage('ai', "**Error:** Could not connect to the AI server. Check your Render URL.");
            }
        }

        function streamAIResponse(answer) {
            const msgId = db.ref(`chats/${currentChatId}/messages`).push().key;
            const msgDiv = document.createElement('div');
            msgDiv.className = 'flex w-full mb-6 justify-start';
            const bubble = document.createElement('div');
            bubble.className = 'max-w-[85%] rounded-2xl p-4 shadow-sm bg-white dark:bg-dark-surface border dark:border-gray-700 prose dark:prose-invert typing-cursor';
            msgDiv.appendChild(bubble);
            els.msgContainer.appendChild(msgDiv);

            let i = 0;
            const interval = setInterval(() => {
                bubble.innerHTML = marked.parse(answer.substring(0, i));
                els.msgContainer.scrollTop = els.msgContainer.scrollHeight;
                if (i++ >= answer.length) {
                    clearInterval(interval);
                    bubble.classList.remove('typing-cursor');
                    saveMessage('ai', answer);
                }
            }, 15);
        }

        function appendMessage(role, content) {
            const div = document.createElement('div');
            div.className = `flex w-full mb-6 ${role === 'user' ? 'justify-end' : 'justify-start'}`;
            const bubble = document.createElement('div');
            bubble.className = `max-w-[85%] rounded-2xl p-4 shadow-sm ${role === 'user' ? 'bg-brand-600 text-white' : 'bg-white dark:bg-dark-surface border dark:border-gray-700 prose dark:prose-invert'}`;
            bubble.innerHTML = role === 'user' ? content : marked.parse(content);
            div.appendChild(bubble);
            els.msgContainer.appendChild(div);
            els.msgContainer.scrollTop = els.msgContainer.scrollHeight;
        }

        function saveMessage(role, content) {
            if (currentChatId) db.ref(`chats/${currentChatId}/messages`).push({ role, content, timestamp: firebase.database.ServerValue.TIMESTAMP });
        }

        function loadHistory() {
            db.ref('chats').orderByChild('userId').equalTo(currentUser.uid).on('value', (snapshot) => {
                els.historyList.innerHTML = '';
                snapshot.forEach(child => {
                    const btn = document.createElement('button');
                    btn.className = "w-full text-left p-3 rounded-lg text-sm mb-1 hover:bg-gray-200 dark:hover:bg-gray-700 truncate";
                    btn.innerHTML = `<i class="ri-message-3-line mr-2"></i> ${child.val().title}`;
                    btn.onclick = () => loadChat(child.key);
                    els.historyList.prepend(btn);
                });
            });
        }

        function loadChat(chatId) {
            currentChatId = chatId;
            els.msgContainer.innerHTML = '';
            document.getElementById('welcome-screen').classList.add('hidden');
            db.ref(`chats/${chatId}/messages`).once('value', snap => {
                snap.forEach(c => appendMessage(c.val().role, c.val().content));
            });
        }

        // --- 6. UTILS & THEME ---
        els.newChatBtn.onclick = () => { currentChatId = null; els.msgContainer.innerHTML = ''; document.getElementById('welcome-screen').classList.remove('hidden'); };
        document.getElementById('btn-logout').onclick = () => auth.signOut();
        document.getElementById('btn-theme').onclick = () => { document.documentElement.classList.toggle('dark'); };
        els.mobileMenuBtn.onclick = () => els.sidebar.classList.remove('-translate-x-full');
        els.closeSidebarBtn.onclick = () => els.sidebar.classList.add('-translate-x-full');
        els.userProfile.onclick = (e) => { e.stopPropagation(); els.settingsMenu.classList.toggle('hidden'); };
        document.addEventListener('click', () => els.settingsMenu.classList.add('hidden'));
        els.adminBtn.onclick = () => els.adminPanel.classList.remove('hidden');
        document.getElementById('close-admin').onclick = () => els.adminPanel.classList.add('hidden');

    </script>
</body>
</html>
