<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Knowledge Pro | AI Assistant</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gemini: {
                            50: '#f0f4f8',
                            100: '#d9e2ec',
                            500: '#3b82f6', // Brand blue
                            600: '#2563eb',
                            900: '#1e3a8a',
                        },
                        dark: {
                            bg: '#131314',
                            surface: '#1e1f20',
                            input: '#2d2e2f'
                        }
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }

        /* Typography & Layout */
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .prose pre { background: #1e1e1e; color: #d4d4d4; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; }
        .prose code { color: #ef4444; background: rgba(0,0,0,0.05); padding: 0.2rem 0.4rem; border-radius: 0.25rem; }
        .dark .prose code { color: #fca5a5; background: rgba(255,255,255,0.1); }
        
        /* Mobile Input Fixes */
        .safe-area-bottom { padding-bottom: env(safe-area-inset-bottom); }
        
        /* Loader */
        #loading { position: fixed; inset: 0; background: white; z-index: 9999; display: flex; justify-content: center; align-items: center; flex-direction: column; transition: opacity 0.5s; }
        .dark #loading { background: #131314; color: white; }
        
        /* Hide scrollbar but keep functionality for sidebar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Streaming Cursor */
        .cursor-blink::after { content: '▋'; animation: blink 1s step-start infinite; color: #3b82f6; margin-left: 2px; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body class="bg-white text-gray-900 dark:bg-dark-bg dark:text-gray-100 transition-colors duration-200 h-[100dvh] overflow-hidden flex flex-col">

    <div id="loading">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mb-4"></div>
        <h2 class="text-xl font-semibold">Knowledge Pro</h2>
        <p class="text-sm text-gray-500 mt-2">Initializing Core Systems...</p>
    </div>

    <div id="auth-screen" class="hidden fixed inset-0 z-50 bg-white dark:bg-dark-bg flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-white dark:bg-dark-surface p-8 rounded-2xl shadow-xl border border-gray-100 dark:border-gray-800">
            <h1 class="text-3xl font-bold text-center mb-2 bg-gradient-to-r from-blue-500 to-purple-600 bg-clip-text text-transparent">Knowledge Pro</h1>
            <p class="text-center text-gray-500 mb-8">Sign in to continue</p>
            
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Email</label>
                    <input type="email" id="auth-email" class="w-full p-3 rounded-lg border dark:bg-dark-input dark:border-gray-700 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="name@example.com" required>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Password</label>
                    <input type="password" id="auth-pass" class="w-full p-3 rounded-lg border dark:bg-dark-input dark:border-gray-700 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="••••••••" required>
                </div>
                <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition shadow-lg shadow-blue-500/30">
                    Enter Knowledge Pro
                </button>
            </form>
            <div class="mt-4 text-center">
                <button id="toggle-auth-mode" class="text-sm text-blue-500 hover:underline">New user? Create account</button>
            </div>
            <p id="auth-error" class="text-red-500 text-sm text-center mt-4 hidden"></p>
        </div>
    </div>

    <div id="app-interface" class="hidden flex h-full w-full">
        
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-72 bg-gray-50 dark:bg-dark-surface transform -translate-x-full md:translate-x-0 transition-transform duration-300 border-r dark:border-gray-800 flex flex-col">
            <div class="p-4 flex items-center justify-between">
                <div class="flex items-center gap-2 cursor-pointer" onclick="resetChat()">
                    <div class="w-8 h-8 bg-blue-600 rounded-full flex items-center justify-center text-white font-bold">K</div>
                    <span class="font-bold text-lg">Knowledge Pro</span>
                </div>
                <button id="close-sidebar" class="md:hidden text-gray-500"><i class="fas fa-times"></i></button>
            </div>

            <div class="px-4 mb-4">
                <button onclick="createNewChat()" class="w-full flex items-center gap-3 bg-white dark:bg-dark-input hover:bg-gray-100 dark:hover:bg-gray-700 p-3 rounded-full text-sm font-medium shadow-sm border dark:border-gray-700 transition">
                    <i class="fas fa-plus text-blue-500"></i>
                    <span>New Chat</span>
                </button>
            </div>

            <div class="flex-1 overflow-y-auto no-scrollbar px-2" id="chat-history-list">
                </div>

            <div class="p-4 border-t dark:border-gray-800 space-y-2">
                
                <div id="admin-tools" class="hidden space-y-1">
                    <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2 ml-2">Admin Console</p>
                    <button onclick="openModal('modal-train')" class="w-full text-left p-2 hover:bg-gray-200 dark:hover:bg-gray-700 rounded-lg text-sm flex items-center gap-2">
                        <i class="fas fa-brain text-purple-500"></i> Train AI
                    </button>
                    <button onclick="openModal('modal-models')" class="w-full text-left p-2 hover:bg-gray-200 dark:hover:bg-gray-700 rounded-lg text-sm flex items-center gap-2">
                        <i class="fas fa-layer-group text-green-500"></i> Manage Models
                    </button>
                    <button onclick="openModal('modal-users')" class="w-full text-left p-2 hover:bg-gray-200 dark:hover:bg-gray-700 rounded-lg text-sm flex items-center gap-2">
                        <i class="fas fa-users text-orange-500"></i> User History/Ban
                    </button>
                    <button onclick="openModal('modal-reports')" class="w-full text-left p-2 hover:bg-gray-200 dark:hover:bg-gray-700 rounded-lg text-sm flex items-center gap-2">
                        <i class="fas fa-flag text-red-500"></i> Reports
                    </button>
                </div>

                <div class="h-px bg-gray-200 dark:bg-gray-700 my-2"></div>

                <button onclick="openModal('modal-settings')" class="w-full text-left p-2 hover:bg-gray-200 dark:hover:bg-gray-700 rounded-lg text-sm flex items-center gap-2">
                    <i class="fas fa-cog"></i> Settings
                </button>
                <div class="flex items-center justify-between p-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 cursor-pointer text-sm" onclick="logout()">
                    <div class="flex items-center gap-2">
                        <i class="fas fa-sign-out-alt"></i>
                        <span id="user-email-display" class="truncate max-w-[120px]">user</span>
                    </div>
                </div>
            </div>
        </aside>

        <main class="flex-1 flex flex-col h-full relative md:ml-72 bg-white dark:bg-dark-bg transition-colors">
            
            <header class="h-14 flex items-center justify-between px-4 border-b dark:border-gray-800">
                <div class="flex items-center gap-3">
                    <button id="mobile-menu-btn" class="md:hidden text-gray-500 p-2"><i class="fas fa-bars"></i></button>
                    <div class="relative group">
                        <button class="flex items-center gap-2 text-sm font-medium hover:bg-gray-100 dark:hover:bg-gray-800 px-3 py-1.5 rounded-lg transition">
                            <span id="current-model-name">Gemini Pro</span>
                            <i class="fas fa-chevron-down text-xs text-gray-400"></i>
                        </button>
                        <div class="absolute top-full left-0 mt-1 w-48 bg-white dark:bg-dark-surface border dark:border-gray-700 rounded-lg shadow-xl hidden group-hover:block z-50 py-1" id="model-selector-list">
                            </div>
                    </div>
                </div>
                <div>
                     <button id="theme-toggle" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-500">
                        <i class="fas fa-moon dark:hidden"></i>
                        <i class="fas fa-sun hidden dark:inline"></i>
                    </button>
                </div>
            </header>

            <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-6 pb-32 scroll-smooth">
                <div id="welcome-screen" class="h-full flex flex-col items-center justify-center text-center opacity-80">
                    <div class="w-16 h-16 bg-gradient-to-br from-blue-400 to-red-400 rounded-full mb-6 animate-pulse-slow"></div>
                    <h1 class="text-4xl font-bold bg-gradient-to-r from-blue-500 to-pink-500 bg-clip-text text-transparent mb-2">Hello, User</h1>
                    <p class="text-gray-500 text-lg">How can I help you today?</p>
                </div>
                </div>

            <div class="absolute bottom-0 left-0 right-0 bg-white dark:bg-dark-bg p-4 pt-2 safe-area-bottom">
                <div class="max-w-3xl mx-auto relative">
                    <div id="typing-indicator" class="hidden absolute -top-8 left-0 text-xs text-gray-500 flex items-center gap-1">
                        <i class="fas fa-robot"></i> AI is thinking...
                    </div>

                    <div class="flex items-end gap-2 bg-gray-100 dark:bg-dark-input rounded-3xl p-2 border border-transparent focus-within:border-gray-300 dark:focus-within:border-gray-600 transition-colors shadow-sm">
                        <button class="p-3 text-gray-400 hover:text-blue-500 transition rounded-full"><i class="fas fa-plus-circle"></i></button>
                        <textarea id="user-input" rows="1" class="w-full bg-transparent border-none focus:ring-0 resize-none py-3 text-gray-900 dark:text-white max-h-32" placeholder="Message Knowledge Pro..."></textarea>
                        <button id="send-btn" class="p-3 bg-blue-600 hover:bg-blue-700 text-white rounded-full transition shadow-md disabled:opacity-50 disabled:cursor-not-allowed">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                    <div class="text-center mt-2 text-[10px] text-gray-400">
                        Knowledge Pro may display inaccurate info, including about people, so double-check its responses.
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="modals">
        <div id="generic-modal" class="hidden fixed inset-0 z-[60] bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
            <div class="bg-white dark:bg-dark-surface w-full max-w-2xl rounded-xl shadow-2xl max-h-[90vh] flex flex-col">
                <div class="p-4 border-b dark:border-gray-700 flex justify-between items-center">
                    <h3 id="modal-title" class="text-lg font-bold">Settings</h3>
                    <button onclick="closeModal()" class="text-gray-500 hover:text-red-500"><i class="fas fa-times text-xl"></i></button>
                </div>
                <div id="modal-content" class="p-6 overflow-y-auto">
                    </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        /**
         * CONFIGURATION & STATE
         */
        const firebaseConfig = {
            apiKey: "AIzaSyBD473HnZjcmuBlEwd7uaI0MB-hKU4_Nfs",
            authDomain: "knowledge-pro-c9ee5.firebaseapp.com",
            databaseURL: "https://knowledge-pro-c9ee5-default-rtdb.firebaseio.com",
            projectId: "knowledge-pro-c9ee5",
            storageBucket: "knowledge-pro-c9ee5.firebasestorage.app",
            messagingSenderId: "14035001235",
            appId: "1:14035001235:web:cb7c8a0d7c0ce48d729266",
            measurementId: "G-ZXZC2BH72M"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        // State
        let state = {
            user: null,
            isAdmin: false,
            currentChatId: null,
            models: [],
            systemPrompt: "You are Knowledge Pro, a helpful AI assistant.",
            isGenerating: false
        };

        /**
         * UI HELPERS
         */
        const el = (id) => document.getElementById(id);
        const show = (id) => el(id).classList.remove('hidden');
        const hide = (id) => el(id).classList.add('hidden');

        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        // Init Theme
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }

        /**
         * AUTHENTICATION LOGIC
         */
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                // Check if user is banned
                const userRef = db.ref('users/' + user.uid);
                userRef.once('value', async (snapshot) => {
                    const userData = snapshot.val();
                    
                    if (!userData) {
                        // First time setup - check if DB has users, if 0, make admin
                        const allUsersSnap = await db.ref('users').once('value');
                        const isFirstUser = !allUsersSnap.exists();
                        
                        await userRef.set({
                            email: user.email,
                            role: isFirstUser ? 'admin' : 'user',
                            joined: Date.now(),
                            isBanned: false
                        });
                        state.isAdmin = isFirstUser;
                    } else {
                        if (userData.isBanned) {
                            alert("You have been banned by an admin.");
                            auth.signOut();
                            return;
                        }
                        state.isAdmin = (userData.role === 'admin');
                    }

                    state.user = user;
                    el('user-email-display').textContent = user.email;
                    
                    // Toggle Admin UI
                    if(state.isAdmin) show('admin-tools');
                    else hide('admin-tools');

                    hide('loading');
                    hide('auth-screen');
                    show('app-interface');
                    loadChats();
                    loadModels();
                });
            } else {
                state.user = null;
                state.isAdmin = false;
                hide('loading');
                show('auth-screen');
                hide('app-interface');
            }
        });

        // Auth Form Handler
        let isLoginMode = true;
        el('toggle-auth-mode').onclick = (e) => {
            e.preventDefault();
            isLoginMode = !isLoginMode;
            el('toggle-auth-mode').textContent = isLoginMode ? "New user? Create account" : "Already have an account? Sign in";
            document.querySelector('#login-form button').textContent = isLoginMode ? "Enter Knowledge Pro" : "Create Account";
        };

        el('login-form').onsubmit = async (e) => {
            e.preventDefault();
            const email = el('auth-email').value;
            const pass = el('auth-pass').value;
            const errorEl = el('auth-error');
            errorEl.classList.add('hidden');

            try {
                if (isLoginMode) {
                    await auth.signInWithEmailAndPassword(email, pass);
                } else {
                    await auth.createUserWithEmailAndPassword(email, pass);
                }
            } catch (err) {
                errorEl.textContent = err.message;
                errorEl.classList.remove('hidden');
            }
        };

        function logout() {
            auth.signOut();
            window.location.reload();
        }

        /**
         * CHAT & MESSAGING LOGIC
         */
        
        // Auto-resize textarea
        const textarea = el('user-input');
        textarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
            if(this.value === '') this.style.height = 'auto';
        });

        // Send Message
        el('send-btn').onclick = sendMessage;
        textarea.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        async function sendMessage() {
            const text = textarea.value.trim();
            if (!text || state.isGenerating) return;

            // Clear Input
            textarea.value = '';
            textarea.style.height = 'auto';
            hide('welcome-screen');

            // 1. Create/Get Chat ID
            if (!state.currentChatId) {
                const newChatRef = db.ref(`chats/${state.user.uid}`).push();
                state.currentChatId = newChatRef.key;
                await newChatRef.set({
                    title: text.substring(0, 30) + "...",
                    timestamp: Date.now(),
                    modelId: 'default' // Add model selector logic here
                });
                loadChats(); // Refresh sidebar
            }

            // 2. Add User Message to UI & DB
            addMessageToUI('user', text);
            db.ref(`chats/${state.user.uid}/${state.currentChatId}/messages`).push({
                role: 'user',
                content: text,
                timestamp: Date.now()
            });

            // 3. Process AI Response
            state.isGenerating = true;
            show('typing-indicator');
            el('send-btn').disabled = true;

            const aiMessageDiv = addMessageToUI('ai', ''); // Placeholder
            
            try {
                // Check Training Data (Simple "Database Brain")
                const snapshot = await db.ref('training_data').once('value');
                const trainingData = snapshot.val() || {};
                
                // Simple keyword matching (Robust search would need backend)
                let match = null;
                const lowerText = text.toLowerCase();
                
                for (const [key, value] of Object.entries(trainingData)) {
                    if (lowerText.includes(key.toLowerCase())) {
                        match = value;
                        break;
                    }
                }

                if (match) {
                    await streamText(aiMessageDiv, match);
                    saveAiResponse(match);
                } else {
                    // WEB SEARCH SIMULATION (Self-Learning)
                    aiMessageDiv.querySelector('.content').innerHTML = `<em><i class="fas fa-globe-americas animate-spin"></i> Searching Google for "${text}"...</em>`;
                    
                    // Simulate Delay
                    setTimeout(async () => {
                        // Generate a dummy "Learned" response
                        const learnedResponse = `**Google Search Result:**\n\nI found some information about "${text}". \n\nThis is a generated response simulating a live web search because I didn't have this in my training data. I have now saved this information to my database for next time.`;
                        
                        // Save to Training Data (Self Learning!)
                        // Sanitize key for firebase (no . # $ [ ])
                        const safeKey = text.replace(/[.#$[\]]/g, "");
                        await db.ref(`training_data/${safeKey}`).set(learnedResponse);
                        
                        aiMessageDiv.querySelector('.content').innerHTML = ''; // Clear loading
                        await streamText(aiMessageDiv, learnedResponse);
                        saveAiResponse(learnedResponse);
                    }, 2500);
                }

            } catch (err) {
                aiMessageDiv.querySelector('.content').textContent = "Error: " + err.message;
                state.isGenerating = false;
                el('send-btn').disabled = false;
                hide('typing-indicator');
            }
        }

        async function saveAiResponse(content) {
            await db.ref(`chats/${state.user.uid}/${state.currentChatId}/messages`).push({
                role: 'ai',
                content: content,
                timestamp: Date.now()
            });
            state.isGenerating = false;
            el('send-btn').disabled = false;
            hide('typing-indicator');
        }

        // Typing Effect
        function streamText(element, fullText) {
            return new Promise(resolve => {
                const contentDiv = element.querySelector('.content');
                let i = 0;
                contentDiv.classList.add('cursor-blink');
                
                const interval = setInterval(() => {
                    contentDiv.innerHTML = marked.parse(fullText.substring(0, i));
                    scrollToBottom();
                    i++;
                    if (i > fullText.length) {
                        clearInterval(interval);
                        contentDiv.classList.remove('cursor-blink');
                        addReportButton(element, fullText);
                        resolve();
                    }
                }, 15); // Speed
            });
        }

        function addMessageToUI(role, text, msgId = null) {
            const container = el('chat-container');
            const div = document.createElement('div');
            div.className = `flex w-full ${role === 'user' ? 'justify-end' : 'justify-start'}`;
            
            const isAdminBadge = (role === 'ai' && state.isAdmin) ? '<i class="fas fa-check-circle text-blue-500 ml-1 text-xs" title="Verified Admin"></i>' : '';
            
            let innerHTML = `
                <div class="max-w-[85%] md:max-w-[70%] p-4 rounded-2xl ${role === 'user' ? 'bg-gray-100 dark:bg-dark-input rounded-tr-none' : 'text-gray-900 dark:text-gray-100'}">
                    ${role === 'ai' ? `
                        <div class="flex items-center gap-2 mb-1">
                            <div class="w-6 h-6 rounded-full bg-gradient-to-r from-blue-500 to-red-500 flex items-center justify-center text-[10px] text-white">✨</div>
                            <span class="text-xs font-bold text-gray-500">Knowledge Pro ${isAdminBadge}</span>
                        </div>
                    ` : ''}
                    <div class="content prose dark:prose-invert text-sm md:text-base leading-relaxed break-words">
                        ${marked.parse(text)}
                    </div>
                </div>
            `;
            
            div.innerHTML = innerHTML;
            if (msgId) div.dataset.id = msgId;
            container.appendChild(div);
            scrollToBottom();
            return div.querySelector('.max-w-\\[85\\%\\]');
        }

        function addReportButton(msgElement, text) {
            const actionsDiv = document.createElement('div');
            actionsDiv.className = "flex gap-2 mt-2 text-gray-400 text-xs";
            actionsDiv.innerHTML = `
                <button onclick="reportMessage('${text.substring(0,20)}...')" class="hover:text-red-500 tooltip" title="Report Bad Response"><i class="far fa-flag"></i></button>
                <button class="hover:text-blue-500"><i class="far fa-thumbs-up"></i></button>
                <button class="hover:text-blue-500"><i class="far fa-copy"></i></button>
            `;
            msgElement.appendChild(actionsDiv);
        }

        function scrollToBottom() {
            const c = el('chat-container');
            c.scrollTop = c.scrollHeight;
        }

        function resetChat() {
            state.currentChatId = null;
            el('chat-container').innerHTML = '';
            el('chat-container').appendChild(el('welcome-screen'));
            show('welcome-screen');
        }
        
        // Exposed global for onclick
        window.createNewChat = resetChat;

        /**
         * HISTORY MANAGEMENT
         */
        function loadChats() {
            const list = el('chat-history-list');
            list.innerHTML = '';
            
            db.ref(`chats/${state.user.uid}`).orderByChild('timestamp').on('value', snap => {
                list.innerHTML = ''; // clear re-render
                const chats = [];
                snap.forEach(child => {
                    chats.push({ id: child.key, ...child.val() });
                });
                
                chats.reverse().forEach(chat => {
                    const btn = document.createElement('div');
                    btn.className = "group flex items-center justify-between p-2 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg cursor-pointer text-sm mb-1 text-gray-600 dark:text-gray-300";
                    btn.innerHTML = `
                        <div class="flex items-center gap-3 truncate" onclick="openChat('${chat.id}')">
                            <i class="far fa-message"></i>
                            <span class="truncate w-32">${chat.title}</span>
                        </div>
                        <div class="hidden group-hover:flex gap-2">
                             <i class="fas fa-trash text-gray-400 hover:text-red-500" onclick="deleteChat('${chat.id}')"></i>
                        </div>
                    `;
                    list.appendChild(btn);
                });
            });
        }

        window.openChat = async (chatId) => {
            state.currentChatId = chatId;
            hide('welcome-screen');
            el('chat-container').innerHTML = ''; // Clear
            
            if(window.innerWidth < 768) el('close-sidebar').click(); // Close mobile drawer

            const snap = await db.ref(`chats/${state.user.uid}/${chatId}/messages`).once('value');
            snap.forEach(msgSnap => {
                const msg = msgSnap.val();
                const div = addMessageToUI(msg.role, msg.content, msgSnap.key);
                if (msg.role === 'ai') addReportButton(div, msg.content);
            });
        }

        window.deleteChat = (chatId) => {
            if(confirm('Delete this chat?')) {
                db.ref(`chats/${state.user.uid}/${chatId}`).remove();
                if(state.currentChatId === chatId) resetChat();
            }
        }

        /**
         * ADMIN & SETTINGS
         */
        window.openModal = (type) => {
            const modal = el('generic-modal');
            const content = el('modal-content');
            const title = el('modal-title');
            content.innerHTML = '';
            show('generic-modal');

            if (type === 'modal-settings') {
                title.textContent = "Settings";
                content.innerHTML = `
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-bold mb-1">System Prompt (How AI behaves)</label>
                            <textarea id="sys-prompt" class="w-full border rounded p-2 dark:bg-dark-input" rows="3">${state.systemPrompt}</textarea>
                        </div>
                        ${state.isAdmin ? `
                        <div class="p-4 border border-red-200 rounded bg-red-50 dark:bg-red-900/10">
                            <h4 class="font-bold text-red-500 mb-2">Admin Zone</h4>
                            <label class="block text-xs mb-1">Firebase Config (JSON)</label>
                            <textarea class="w-full text-xs font-mono border p-2 h-24" readonly>${JSON.stringify(firebaseConfig, null, 2)}</textarea>
                            <p class="text-xs text-gray-500 mt-1">* Config editing requires redeploy in this version.</p>
                        </div>
                        ` : ''}
                    </div>
                `;
            } 
            
            else if (type === 'modal-train' && state.isAdmin) {
                title.textContent = "Train AI";
                content.innerHTML = `
                    <form onsubmit="trainAI(event)" class="space-y-4">
                        <input type="text" id="train-key" placeholder="User Query (Trigger)" class="w-full p-2 border rounded dark:bg-dark-input" required>
                        <textarea id="train-val" placeholder="AI Response" class="w-full p-2 border rounded dark:bg-dark-input h-32" required></textarea>
                        <button type="submit" class="bg-purple-600 text-white px-4 py-2 rounded">Save Knowledge</button>
                    </form>
                    <div class="mt-4">
                        <h4 class="font-bold">Database</h4>
                        <div id="train-list" class="h-40 overflow-y-auto text-sm border p-2 mt-2">Loading...</div>
                    </div>
                `;
                loadTrainingData();
            }

            else if (type === 'modal-users' && state.isAdmin) {
                title.textContent = "User Management";
                content.innerHTML = `<div id="user-list-admin" class="space-y-2">Loading users...</div>`;
                loadUsersAdmin();
            }

            else if (type === 'modal-models' && state.isAdmin) {
                title.textContent = "Manage Models";
                content.innerHTML = `
                     <form onsubmit="addModel(event)" class="flex gap-2 mb-4">
                        <input id="model-name" placeholder="Model Name (e.g. v2)" class="border p-2 rounded flex-1 dark:bg-dark-input">
                        <select id="model-expiry" class="border p-2 rounded dark:bg-dark-input">
                            <option value="never">Never Expires</option>
                            <option value="1d">1 Day</option>
                        </select>
                        <button class="bg-green-600 text-white p-2 rounded">Add</button>
                     </form>
                     <div id="models-list-admin" class="space-y-2"></div>
                `;
                renderModelsAdmin();
            }

            else if (type === 'modal-reports' && state.isAdmin) {
                title.textContent = "User Reports";
                content.innerHTML = `<div id="reports-list" class="space-y-3">Loading reports...</div>`;
                loadReports();
            }
        };

        window.closeModal = () => hide('generic-modal');

        // --- Admin Logic Implementation ---

        // 1. Training
        window.trainAI = async (e) => {
            e.preventDefault();
            const key = el('train-key').value.replace(/[.#$[\]]/g, ""); // sanitize
            const val = el('train-val').value;
            await db.ref(`training_data/${key}`).set(val);
            alert('Saved!');
            el('train-key').value = '';
            el('train-val').value = '';
            loadTrainingData();
        };

        async function loadTrainingData() {
            const snap = await db.ref('training_data').limitToLast(10).once('value');
            const div = el('train-list');
            if (!div) return;
            div.innerHTML = '';
            snap.forEach(child => {
                div.innerHTML += `<div class="border-b p-1 flex justify-between"><span class="font-bold truncate w-1/3">${child.key}</span> <span class="truncate text-gray-500 w-1/2">${child.val()}</span></div>`;
            });
        }

        // 2. Models
        async function loadModels() {
            // Check default models if empty create them
            const snap = await db.ref('models').once('value');
            if(!snap.exists()) {
                db.ref('models').push({ name: 'Knowledge Pro v1', type: 'free' });
                db.ref('models').push({ name: 'Knowledge Max (Pro)', type: 'pro' });
            }
            // Populate Dropdown
            const list = el('model-selector-list');
            if(list) {
                list.innerHTML = '';
                snap.forEach(child => {
                    const m = child.val();
                    list.innerHTML += `<div onclick="selectModel('${m.name}')" class="px-4 py-2 hover:bg-gray-100 dark:hover:bg-gray-700 cursor-pointer text-sm">${m.name}</div>`;
                });
            }
        }
        
        window.selectModel = (name) => {
            el('current-model-name').textContent = name;
        }

        window.addModel = (e) => {
            e.preventDefault();
            const name = el('model-name').value;
            const expiry = el('model-expiry').value;
            db.ref('models').push({ name, expiry, created: Date.now() });
            renderModelsAdmin();
        };

        async function renderModelsAdmin() {
            const snap = await db.ref('models').once('value');
            const div = el('models-list-admin');
            if(!div) return;
            div.innerHTML = '';
            snap.forEach(c => {
                 div.innerHTML += `<div class="p-2 border rounded flex justify-between">${c.val().name} <button onclick="db.ref('models/${c.key}').remove(); renderModelsAdmin()" class="text-red-500">Delete</button></div>`;
            });
        }

        // 3. User Management
        async function loadUsersAdmin() {
            const snap = await db.ref('users').once('value');
            const div = el('user-list-admin');
            if (!div) return;
            div.innerHTML = '';
            snap.forEach(c => {
                const u = c.val();
                const isMe = u.email === state.user.email;
                div.innerHTML += `
                    <div class="flex items-center justify-between p-3 border rounded dark:border-gray-700">
                        <div>
                            <div class="font-bold text-sm">${u.email}</div>
                            <div class="text-xs text-gray-500">Role: ${u.role} | Status: ${u.isBanned ? '<span class="text-red-500">BANNED</span>' : 'Active'}</div>
                        </div>
                        ${!isMe ? `
                        <div class="flex gap-2">
                             <button onclick="toggleBan('${c.key}', ${!u.isBanned})" class="text-xs px-2 py-1 rounded border ${u.isBanned ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">${u.isBanned ? 'Unban' : 'Ban'}</button>
                             <button onclick="deleteHistory('${c.key}')" class="text-xs px-2 py-1 rounded border bg-gray-100 text-gray-700">Clear Hist</button>
                        </div>
                        ` : '<span class="text-xs italic text-gray-400">You</span>'}
                    </div>
                `;
            });
        }

        window.toggleBan = (uid, status) => {
            db.ref(`users/${uid}`).update({ isBanned: status });
            loadUsersAdmin(); // refresh
        };

        window.deleteHistory = (uid) => {
            if(confirm("Delete all chat history for this user?")) {
                db.ref(`chats/${uid}`).remove();
                alert("History deleted.");
            }
        };

        // 4. Reports
        window.reportMessage = (snippet) => {
            const reason = prompt("Why are you reporting this?");
            if (reason) {
                db.ref('reports').push({
                    uid: state.user.uid,
                    email: state.user.email,
                    snippet: snippet,
                    reason: reason,
                    timestamp: Date.now(),
                    status: 'open'
                });
                alert("Report sent to Admins.");
            }
        };

        async function loadReports() {
            const snap = await db.ref('reports').orderByChild('status').equalTo('open').once('value');
            const div = el('reports-list');
            if (!div) return;
            
            if(!snap.exists()) {
                div.innerHTML = "<p class='text-gray-500'>No open reports.</p>";
                return;
            }

            div.innerHTML = '';
            snap.forEach(c => {
                const r = c.val();
                div.innerHTML += `
                    <div class="p-3 border border-red-200 bg-red-50 dark:bg-red-900/10 rounded">
                        <div class="text-xs text-gray-500 flex justify-between">
                            <span>From: ${r.email}</span>
                            <span>${new Date(r.timestamp).toLocaleDateString()}</span>
                        </div>
                        <div class="font-bold text-sm my-1">Reason: ${r.reason}</div>
                        <div class="bg-white dark:bg-black p-2 rounded text-xs italic mb-2">"${r.snippet}"</div>
                        <button onclick="resolveReport('${c.key}')" class="w-full bg-blue-600 text-white text-xs py-1 rounded">Mark Resolved</button>
                    </div>
                `;
            });
        }

        window.resolveReport = (key) => {
            db.ref(`reports/${key}`).update({ status: 'resolved' });
            loadReports();
        }

        // Mobile Toggle Logic
        el('mobile-menu-btn').onclick = () => {
            const sb = el('sidebar');
            const overlay = document.createElement('div');
            overlay.id = 'sidebar-overlay';
            overlay.className = 'fixed inset-0 bg-black/50 z-30 md:hidden';
            overlay.onclick = () => el('close-sidebar').click();
            document.body.appendChild(overlay);
            
            sb.classList.remove('-translate-x-full');
        };

        el('close-sidebar').onclick = () => {
            el('sidebar').classList.add('-translate-x-full');
            const overlay = el('sidebar-overlay');
            if (overlay) overlay.remove();
        };

    </script>
</body>
</html>
